<title>CrystalBall · Full Test Suite v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,700;1,300&family=Syne:wght@400;700;800&display=swap');
:root{--bg:#040608;--s1:#080c10;--s2:#0c1218;--s3:#101820;--border:#182330;--border2:#1e2e3c;--c0:#00f0c0;--c1:#ff4060;--c2:#ffc030;--c3:#60a0ff;--c4:#c060ff;--c5:#40e080;--c6:#ff8040;--c7:#ff60c0;--c8:#00c8ff;--text:#b8ccd8;--text2:#506070;--text3:#2a3a48;--font:'JetBrains Mono',monospace;--display:'Syne',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:11px;line-height:1.5;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,240,192,.007) 3px,rgba(0,240,192,.007) 4px);pointer-events:none;z-index:9998;}
#topbar{height:44px;background:var(--s1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;position:relative;z-index:100;}
#topbar h1{font-family:var(--display);font-size:17px;font-weight:800;color:var(--c0);letter-spacing:-.3px;}
#topbar .sub{color:var(--text2);font-size:9px;letter-spacing:2px;text-transform:uppercase;}
#topbar .spacer{flex:1;}
#topbar .counters{display:flex;gap:12px;font-size:10px;}
.cnt-pass{color:var(--c0);}.cnt-fail{color:var(--c1);}.cnt-skip{color:var(--c2);}
#topbar button{background:var(--c0);color:var(--bg);border:none;border-radius:3px;font-family:var(--font);font-size:10px;font-weight:700;padding:5px 14px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;}

#layout{display:grid;grid-template-columns:230px 1fr 320px;height:calc(100vh - 44px);overflow:hidden;}
#sidebar{background:var(--s1);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;}
.suite-group{border-bottom:1px solid var(--border);}
.suite-head{padding:8px 12px 7px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.suite-head .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.test-item{padding:5px 12px 5px 22px;cursor:pointer;font-size:10px;color:var(--text2);display:flex;align-items:center;gap:6px;border-left:2px solid transparent;transition:all .1s;}
.test-item:hover{color:var(--text);background:var(--s2);}
.test-item.active{color:var(--text);border-left-color:var(--c0);background:var(--s2);}
.test-item.pass{color:var(--c0);}.test-item.fail{color:var(--c1);}.test-item.running{color:var(--c2);}

#main{display:flex;flex-direction:column;overflow:hidden;background:var(--s2);}
#test-header{padding:14px 18px 12px;border-bottom:1px solid var(--border);background:var(--s1);flex-shrink:0;}
#test-header .test-name{font-family:var(--display);font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;}
#test-header .test-meta{color:var(--text2);font-size:9px;letter-spacing:1px;display:flex;gap:14px;flex-wrap:wrap;}

.meta-tag.pass{color:var(--c0);border-color:var(--c0);}.meta-tag.fail{color:var(--c1);border-color:var(--c1);}.meta-tag.run{color:var(--c2);border-color:var(--c2);}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}}
.result-row.pass{border-left:2px solid var(--c0);}.result-row.fail{border-left:2px solid var(--c1);background:rgba(255,64,96,.04);}.result-row.info{border-left:2px solid var(--c3);}.result-row.warn{border-left:2px solid var(--c2);}.result-row.media{border-left:2px solid var(--c8);}
.result-row .icon{font-size:11px;padding-top:1px;}.result-row .body{color:var(--text);font-size:10px;}.result-row .body .label{color:var(--text2);}.result-row .body .val{color:var(--c0);}.result-row .body .val.bad{color:var(--c1);}.result-row .body .val.warn{color:var(--c2);}.result-row .body .val.blue{color:var(--c3);}.result-row .body .val.purple{color:var(--c4);}.result-row .body .val.cyan{color:var(--c8);}
.result-row .dur{color:var(--text2);font-size:9px;white-space:nowrap;}
.result-row pre{margin-top:5px;font-size:9px;color:var(--text2);background:var(--bg);padding:6px 8px;border-radius:2px;overflow-x:auto;max-height:100px;white-space:pre-wrap;word-break:break-all;}
/* Media preview */
.media-preview{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;}
.media-preview canvas,.media-preview img{border:1px solid var(--border);border-radius:2px;}
.media-preview audio{width:100%;margin-top:4px;filter:invert(.8) hue-rotate(180deg);}
#log-panel{background:var(--s1);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
#log-header{padding:10px 12px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;}
#log-header .title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--c4);}
#log-header .ev-count{color:var(--text2);font-size:9px;margin-left:auto;}
.log-filters{padding:7px 10px;border-bottom:1px solid var(--border);display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.lf-btn{font-size:8px;font-family:var(--font);font-weight:700;padding:2px 6px;border-radius:2px;cursor:pointer;border:1px solid var(--border2);background:var(--s2);color:var(--text2);letter-spacing:.5px;transition:all .1s;}
.lf-btn.active{background:var(--c4);color:var(--bg);border-color:var(--c4);}
#log-stream{flex:1;overflow-y:auto;padding:6px 0;font-size:9px;}
.log-ev{padding:3px 10px 3px 12px;border-left:2px solid transparent;display:grid;grid-template-columns:60px 1fr;gap:6px;line-height:1.4;transition:background .1s;}
.log-ev:hover{background:var(--s2);}
.log-ev.t-media{border-left-color:var(--c8);}.log-ev.t-ase{border-left-color:var(--c4);}.log-ev.t-resonance{border-left-color:var(--c0);}.log-ev.t-idl{border-left-color:var(--c5);}.log-ev.t-heuristic{border-left-color:var(--c7);}.log-ev.t-kernel{border-left-color:var(--c4);}.log-ev.t-codec{border-left-color:var(--c7);}.log-ev.t-gate{border-left-color:var(--c2);}.log-ev.t-error{border-left-color:var(--c1);background:rgba(255,64,96,.03);}
.log-ev .ts{color:var(--text3);font-size:8px;padding-top:1px;}.log-ev .etype{color:var(--text2);}.log-ev .etype .ns{color:var(--text3);}.log-ev .epay{font-size:8px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#progress-wrap{height:3px;background:var(--border);flex-shrink:0;overflow:hidden;}
#progress-bar{height:100%;background:var(--c0);width:0%;transition:width .3s ease;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}::-webkit-scrollbar-thumb:hover{background:var(--text2);}
/* Upload zone */
.upload-zone{border:1px dashed var(--border2);border-radius:3px;padding:10px;text-align:center;color:var(--text2);font-size:9px;cursor:pointer;margin-top:6px;}
.upload-zone:hover{border-color:var(--c0);color:var(--c0);}

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
// CAUSAL NEXUS — minimal inline kernel
// ═══════════════════════════════════════════════════════════════
const Nexus = (() => {
  function newId(){if(typeof crypto!=='undefined'&&crypto.randomUUID)return crypto.randomUUID();const b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;const h=Array.from(b).map(x=>x.toString(16).padStart(2,'0'));return[h.slice(0,4),h.slice(4,6),h.slice(6,8),h.slice(8,10),h.slice(10,16)].map(a=>a.join('')).join('-');}
  function shortId(id){const p=id.split('-');return p[p.length-1]||id.slice(-8);}
  function wallNow(){return Date.now();}
  function formatTs(ms){const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')+'.'+String(d.getMilliseconds()).padStart(3,'0');}
  const EDGE_CAUSAL='causal/explicit', EDGE_RULE='causal/rule';
  function gateOutput(type,payload,meta){return{type,payload:payload??{},meta:meta??{}};}
  function createKernel({ringCap=5000}={}){
    const ring=[],byId=new Map(),typeIdx=new Map(),parents=new Map(),children=new Map();
    const gates=[],listeners=new Set();
    let head=0,size=0,tick=0,gDepth=0;
    function store(ev){if(size===ringCap){const old=ring[head];if(old){byId.delete(old.id);typeIdx.get(old.type)?.delete(old.id);parents.delete(old.id);children.get(old.id)?.forEach(c=>parents.delete(c));children.delete(old.id);}}ring[head]=ev;head=(head+1)%ringCap;if(size<ringCap)size++;byId.set(ev.id,ev);if(!typeIdx.has(ev.type))typeIdx.set(ev.type,new Set());typeIdx.get(ev.type).add(ev.id);}
    function runGates(ev){if(gDepth>=20)return[];gDepth++;const outs=[];const sorted=[...gates].sort((a,b)=>a.p-b.p);try{for(const g of sorted){let r;try{r=g.fn(ev);}catch{r=[];}if(Array.isArray(r))outs.push(...r);}}finally{gDepth--;}return outs;}
    function ingest(type,payload={},meta={}){const id=newId(),ts=wallNow(),eventTs=++tick;const ev=Object.freeze({id,type,payload:Object.freeze({...payload}),source:meta.source??'test',causedBy:meta.causedBy??null,edgeType:meta.edgeType??null,eventTs,ts});store(ev);if(ev.causedBy){parents.set(ev.id,ev.causedBy);if(!children.has(ev.causedBy))children.set(ev.causedBy,new Set());children.get(ev.causedBy).add(ev.id);}const outs=runGates(ev);for(const o of outs)ingest(o.type,o.payload,{...o.meta,causedBy:o.meta?.causedBy??ev.id,edgeType:o.meta?.edgeType??EDGE_RULE});for(const fn of listeners)try{fn(ev);}catch{}return ev;}
    function subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn);}
    function registerGate(sig,fn,p=50){gates.push({sig,fn,p});}
    function getAll(){const out=[];for(let i=0;i<size;i++)out.push(ring[(head-size+i+ringCap)%ringCap]);return out;}
    function findById(id){return byId.get(id)??null;}
    function traceToRoot(id,max=50){const c=[];let cur=id,d=0;while(cur&&d++<max){c.push(cur);cur=parents.get(cur);}return c.map(i=>byId.get(i)).filter(Boolean);}
    function stats(){return{size,cap:ringCap,tick,types:[...typeIdx.keys()].length};}
    return{ingest,subscribe,registerGate,getAll,findById,traceToRoot,stats,_typeIdx:typeIdx,gateOutput,EDGE_CAUSAL,EDGE_RULE};
  }
  return{newId,shortId,wallNow,formatTs,gateOutput,createKernel,EDGE_CAUSAL:'causal/explicit',EDGE_RULE:'causal/rule'};
})();

// ═══════════════════════════════════════════════════════════════
// HEURISTIC EXTRACTOR — from Resonance/src/extraction/heuristics.ts
// ═══════════════════════════════════════════════════════════════
const Heuristic = (() => {
  const ABSTRACT=new Set(['meaning','essence','truth','consciousness','structure','pattern','system','theory','concept','abstraction','principle','framework','paradigm','philosophy','ontology','emergence','complexity','entropy','coherence','resonance','signal','dynamic','recursive','temporal','fundamental']);
  const CONCRETE=new Set(['table','chair','walk','eat','drive','house','door','hand','money','work','job','car','food','body','room','street','today','yesterday','now','here','store','phone','coffee']);
  const SOMATIC=new Set(['chest','breath','body','stomach','skin','hands','spine','gut','heart','throat','eyes','shoulder','weight','tired','heavy','ache','warm','cold','tight','release','tension','pulse','numb','hollow','burning','neck','jaw']);
  const METAPHOR=[/\blike\s+a\b/gi,/\bas\s+if\b/gi,/\bwaves?\b/gi,/\becho(es)?\b/gi,/\bbridge\b/gi,/\broot(s|ed)?\b/gi,/\bthread(s)?\b/gi,/\bmirror(s|ed|ing)?\b/gi,/\bfractal\b/gi,/\blayer(s)?\b/gi];
  const CAUSAL=[/\bbecause\b/gi,/\btherefore\b/gi,/\bwhich\s+means\b/gi,/\bleads?\s+to\b/gi,/\bimplies?\b/gi,/\bconsequently\b/gi,/\bthus\b/gi,/\bhence\b/gi];
  const SELF_REF=[/\bI\s+(think|feel|notice|realize|wonder|mean|find|believe)\b/gi,/\bmy\s+(sense|feeling|thought|pattern|way|tendency|mind)\b/gi,/\bpart\s+of\s+me\b/gi,/\bwithin\s+me\b/gi];
  const URGENCY=new Set(['now','immediately','urgent','crisis','need','must','right now','deadline','quickly','fast','panic','desperate','breaking','failing','lost']);
  const NEGATIVE=new Set(['broken','lost','fail','wrong','bad','hurt','pain','alone','empty','hollow','dark','dead','collapse','grief','fear','dread','shame','guilt','rage','despair','nothing','never']);
  const POSITIVE=new Set(['good','clear','true','love','joy','alive','light','hope','build','grow','create','connect','understand','free','open','real','whole','full','solid','strong','beautiful','meaningful']);
  const SYMBOLIC=new Set(['god','soul','shadow','fire','death','birth','void','cosmos','sacred','myth','archetype','ritual','fate','destiny','eternal','infinite','threshold','vessel','wound','gift']);
  const ANALYTIC=new Set(['therefore','however','because','analysis','evidence','conclude','hypothesis','logical','rational','systematic','observe','measure','compare','define','classify']);

  function clamp(n){return Math.max(0,Math.min(1,n));}
  function words(t){return t.toLowerCase().match(/\b[a-z']+\b/g)||[];}
  function sents(t){return t.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);}
  function lexRatio(ws,set){if(!ws.length)return 0;return ws.filter(w=>set.has(w)).length/ws.length;}
  function countMatch(t,pats){return pats.reduce((s,p)=>{const m=t.match(new RegExp(p.source,p.flags));return s+(m?m.length:0);},0);}

  function extract(userId,text){
    if(!text||text.trim().length<3)return null;
    const ws=words(text),ss=sents(text),n=ws.length||1;
    // cognition
    const abstractionLevel=clamp(lexRatio(ws,ABSTRACT)*4-lexRatio(ws,CONCRETE)*2+0.4);
    const causalCount=countMatch(text,CAUSAL);
    const systemThinking=clamp(causalCount/Math.max(ss.length,1)*1.5);
    const selfRefCount=countMatch(text,SELF_REF);
    const recursionDepth=clamp(selfRefCount/n*8);
    const avgSentLen=ss.reduce((s,st)=>s+st.split(/\s+/).length,0)/Math.max(ss.length,1);
    const compression=clamp((avgSentLen-5)/20);
    const linearity=clamp(1-recursionDepth*0.5-abstractionLevel*0.3);

    // affect
    const valence=clamp(0.5+lexRatio(ws,POSITIVE)*2-lexRatio(ws,NEGATIVE)*2);
    const urgencyScore=lexRatio(ws,URGENCY);
    const urgency=clamp(urgencyScore*5);
    const exclamations=(text.match(/!/g)||[]).length;
    const volatility=clamp(exclamations/n*10+urgency*0.4);
    const somaticDensity=clamp(lexRatio(ws,SOMATIC)*6);
    const attachmentLoad=clamp((text.match(/\byou\b|\bwe\b|\bus\b|\bour\b|\btogether\b/gi)||[]).length/n*4);

    // language
    const metaphorCount=countMatch(text,METAPHOR);
    const metaphorDensity=clamp(metaphorCount/n*6);
    const symbolicUsage=clamp(lexRatio(ws,SYMBOLIC)*8);
    const poeticness=clamp(metaphorDensity*0.5+symbolicUsage*0.3+(text.includes('—')||text.includes('...')?0.2:0));
    const analyticalness=clamp(lexRatio(ws,ANALYTIC)*6);
    const narrativeStructure=clamp(ss.length>3?(ss.length/10):0.2);

    const entropy=clamp(1-analyticalness*0.4-linearity*0.3+poeticness*0.2);
    const intensity=clamp(urgency*0.4+volatility*0.3+Math.abs(valence-0.5)*0.6);

    // confidence
    let confidence=1.0;
    if(n<20)confidence-=0.4;else if(n<50)confidence-=0.15;
    const allVals=[abstractionLevel,systemThinking,recursionDepth,compression,linearity,valence,urgency,volatility,somaticDensity,attachmentLoad,metaphorDensity,symbolicUsage,poeticness,analyticalness,narrativeStructure];
    if(allVals.every(v=>v<0.1))confidence-=0.4;
    const vari=allVals.reduce((s,v)=>{const m=allVals.reduce((a,b)=>a+b,0)/allVals.length;return s+(v-m)**2;},0)/allVals.length;
    if(vari<0.005)confidence-=0.2;
    confidence=Math.max(0,Math.min(1,confidence));

    return{userId,timestamp:Date.now(),text,cognition:{abstractionLevel,linearity,recursionDepth,systemThinking,compression},affect:{valence,volatility,attachmentLoad,urgency,somaticDensity},language:{metaphorDensity,symbolicUsage,poeticness,analyticalness,narrativeStructure},entropy,intensity,extractionMethod:'heuristic',confidence};
  }
  return{extract};
})();

// ═══════════════════════════════════════════════════════════════
// ASE — Authorship Signature Engine
// ═══════════════════════════════════════════════════════════════
const ASE = (() => {
  const EMA_ALPHA=0.15, DRIFT_THRESHOLD=0.12, MIN_SAMPLES=5;
  const store=new Map(); // userId → signature

  function ema(cur,nv,a){return cur*(1-a)+nv*a;}
  function emaGroup(cur,nv,a){const r={};Object.keys(cur).forEach(k=>{r[k]=ema(cur[k],nv[k]??cur[k],a);});return r;}

  function inferMode(core){
    const c=core.cognition,a=core.affect,l=core.language;
    if(c.abstractionLevel>0.7&&c.systemThinking>0.6)return'systems-architect';
    if(l.poeticness>0.65&&l.symbolicUsage>0.55)return'symbolic-poet';
    if(c.recursionDepth>0.65&&a.attachmentLoad<0.4)return'deep-internal-processor';
    if(a.volatility>0.6&&a.somaticDensity>0.5)return'somatic-emotive';
    if(l.analyticalness>0.65&&c.linearity>0.6)return'analytical-structured';
    if(a.attachmentLoad>0.65&&l.narrativeStructure>0.55)return'relational-narrator';
    if(core.entropy>0.65&&c.compression>0.6)return'high-entropy-synthesizer';
    if(a.urgency>0.6&&core.intensity>0.65)return'high-intensity-driver';
    return'adaptive-generalist';
  }

  function computeFingerprint(core,history){
    const varMap={};
    if(Object.keys(history).length>0){
      Object.entries(history).forEach(([k,vals])=>{
        if(vals.length<2)return;
        const m=vals.reduce((a,b)=>a+b,0)/vals.length;
        varMap[k]=vals.reduce((s,v)=>s+(v-m)**2,0)/vals.length;
      });
    }
    const sorted=Object.entries(varMap).sort((a,b)=>b[1]-a[1]);
    const highVarianceAxes=sorted.slice(0,3).map(([k])=>k);
    const lowVarianceAxes=sorted.slice(-3).map(([k])=>k);
    const dominantMode=inferMode(core);
    return{highVarianceAxes,lowVarianceAxes,dominantMode,secondaryMode:'adaptive-generalist'};
  }

  function computeDrift(oldCore,newCore){
    const groups=['cognition','affect','language'];
    const movingAxes=[];let total=0,count=0;
    groups.forEach(g=>{
      Object.entries(oldCore[g]).forEach(([k,ov])=>{
        const nv=newCore[g][k];
        const delta=Math.abs(nv-ov);
        total+=delta;count++;
        if(delta>DRIFT_THRESHOLD)movingAxes.push(g+'.'+k);
      });
    });
    total+=Math.abs(oldCore.entropy-newCore.entropy)+Math.abs(oldCore.intensity-newCore.intensity);
    count+=2;
    const magnitude=total/count;
    return{magnitude,direction:movingAxes,isShifting:magnitude>DRIFT_THRESHOLD,lastShiftAt:null};
  }

  function ingest(userId,signal){
    const existing=store.get(userId);
    const history={};
    if(!existing){
      // First signal — initialize
      const sig={userId,version:1,createdAt:Date.now(),updatedAt:Date.now(),sampleSize:1,
        core:{cognition:{...signal.cognition},affect:{...signal.affect},language:{...signal.language},entropy:signal.entropy,intensity:signal.intensity},
        fingerprint:{highVarianceAxes:[],lowVarianceAxes:[],dominantMode:inferMode({cognition:signal.cognition,affect:signal.affect,language:signal.language,entropy:signal.entropy,intensity:signal.intensity}),secondaryMode:'adaptive-generalist'},
        drift:{magnitude:0,direction:[],isShifting:false,lastShiftAt:null}};
      store.set(userId,sig);
      return sig;
    }
    // Build history from accumulated changes
    const oldCore=existing.core;
    const newCore={
      cognition:emaGroup(existing.core.cognition,signal.cognition,EMA_ALPHA),
      affect:emaGroup(existing.core.affect,signal.affect,EMA_ALPHA),
      language:emaGroup(existing.core.language,signal.language,EMA_ALPHA),
      entropy:ema(existing.core.entropy,signal.entropy,EMA_ALPHA),
      intensity:ema(existing.core.intensity,signal.intensity,EMA_ALPHA)
    };
    const drift=computeDrift(oldCore,newCore);
    const fingerprint=computeFingerprint(newCore,history);
    const updated={...existing,version:existing.version+1,updatedAt:Date.now(),sampleSize:existing.sampleSize+1,core:newCore,fingerprint,drift:{...drift,lastShiftAt:drift.isShifting?Date.now():existing.drift.lastShiftAt}};
    store.set(userId,updated);
    return updated;
  }

  function get(userId){return store.get(userId)??null;}
  function isTrusted(userId){const s=store.get(userId);return s!==null&&s!==undefined&&s.sampleSize>=MIN_SAMPLES;}

  function distance(userA,userB){
    const a=store.get(userA),b=store.get(userB);
    if(!a||!b)return null;
    const groups=['cognition','affect','language'];
    let total=0,count=0;
    groups.forEach(g=>{Object.keys(a.core[g]).forEach(k=>{total+=Math.abs(a.core[g][k]-b.core[g][k]);count++;});});
    total+=Math.abs(a.core.entropy-b.core.entropy)+Math.abs(a.core.intensity-b.core.intensity);
    count+=2;
    return total/count;
  }

  function clear(userId){store.delete(userId);}
  function clearAll(){store.clear();}
  return{ingest,get,isTrusted,distance,clear,clearAll,MIN_SAMPLES};
})();

// RESONANCE ENGINE — from Resonance/src/resonance/scoring.ts
// ═══════════════════════════════════════════════════════════════
const Resonance = (() => {
  function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0);}
  function mag(v){return Math.sqrt(v.reduce((s,x)=>s+x*x,0));}
  function cosine(a,b){const m=mag(a)*mag(b);if(m===0)return 0;return Math.max(-1,Math.min(1,dot(a,b)/m));}

  function toVec(s){return[...Object.values(s.cognition),...Object.values(s.affect),...Object.values(s.language),s.entropy,s.intensity];}
  function groupVec(s,g){return Object.values(s[g]);}

  function avgSignal(sigs){
    if(!sigs.length)return null;
    const avg=(k,g)=>sigs.reduce((s,v)=>s+v[g][k],0)/sigs.length;
    const t=sigs[0];
    return{...t,cognition:Object.fromEntries(Object.keys(t.cognition).map(k=>[k,avg(k,'cognition')])),affect:Object.fromEntries(Object.keys(t.affect).map(k=>[k,avg(k,'affect')])),language:Object.fromEntries(Object.keys(t.language).map(k=>[k,avg(k,'language')])),entropy:sigs.reduce((s,v)=>s+v.entropy,0)/sigs.length,intensity:sigs.reduce((s,v)=>s+v.intensity,0)/sigs.length};
  }

  function structural(a,b){
    const cogSim=(cosine(groupVec(a,'cognition'),groupVec(b,'cognition'))+1)/2;
    const affSim=(cosine(groupVec(a,'affect'),groupVec(b,'affect'))+1)/2;
    const langSim=(cosine(groupVec(a,'language'),groupVec(b,'language'))+1)/2;
    return{total:cogSim*0.35+affSim*0.35+langSim*0.30,cognition:cogSim,affect:affSim,language:langSim};
  }

  function makeOscProfile(userId,signals){
    if(!signals.length)return null;
    const cogAmps=signals.map(s=>Object.values(s.cognition).reduce((a,b)=>a+b,0)/5);
    const affAmps=signals.map(s=>Object.values(s.affect).reduce((a,b)=>a+b,0)/5);
    const langAmps=signals.map(s=>Object.values(s.language).reduce((a,b)=>a+b,0)/5);
    function amp(vals){if(vals.length<2)return 0;const m=vals.reduce((a,b)=>a+b,0)/vals.length;return Math.sqrt(vals.reduce((s,v)=>s+(v-m)**2,0)/vals.length);}
    function freq(vals){let flips=0;for(let i=1;i<vals.length;i++)if(Math.sign(vals[i]-vals[i-1])!==Math.sign(vals[i-1]-vals[i-2]??0))flips++;return flips/Math.max(vals.length-1,1);}
    const cogA=amp(cogAmps),affA=amp(affAmps),langA=amp(langAmps);
    const overall=(cogA+affA+langA)/3;
    const allAmps=signals.map(s=>s.intensity);
    const stability=1-amp(allAmps);
    return{userId,windowSize:signals.length,computedAt:Date.now(),amplitude:{cognition:cogA,affect:affA,language:langA,overall},frequency:{cognition:freq(cogAmps),affect:freq(affAmps),language:freq(langAmps)},phaseShift:{direction:'stable',magnitude:0},stability:Math.max(0,stability),recovery:0.5,currentPhase:0.5};
  }

  function oscResonance(a,b){
    const ampSim=1-Math.abs(a.amplitude.overall-b.amplitude.overall);
    const freqSim=1-(Math.abs(a.frequency.cognition-b.frequency.cognition)*0.33+Math.abs(a.frequency.affect-b.frequency.affect)*0.33+Math.abs(a.frequency.language-b.frequency.language)*0.33);
    const stabSim=1-Math.abs(a.stability-b.stability);
    return Math.max(0,ampSim*0.4+freqSim*0.4+stabSim*0.2);
  }

  function temporalAlignment(a,b){
    const phaseDiff=Math.abs(a.currentPhase-b.currentPhase);
    const dirMatch=a.phaseShift.direction===b.phaseShift.direction?1:0.3;
    return Math.max(0,(1-phaseDiff)*0.6+dirMatch*0.4);
  }

  function classifyMatch(str,osc,tmp,a,b){
    if(str>0.75&&osc>0.7)return'mirror';
    if(str>0.6&&Math.abs(a.affect.valence-b.affect.valence)>0.3)return'complementary';
    if(str>0.5&&osc<0.4)return'friction';
    if(str<0.4)return'dissonant';
    return'complementary';
  }

  function computeResonance(input){
    const win=input.windowSize??10;
    const rA=input.signalsA.slice(-win),rB=input.signalsB.slice(-win);
    const avgA=avgSignal(rA),avgB=avgSignal(rB);
    if(!avgA||!avgB)return{userA:input.userA,userB:input.userB,computedAt:Date.now(),structural:0,oscillation:0,temporal:0,total:0,matchType:'dissonant',insights:['Insufficient data'],axes:{cognition:0,affect:0,language:0}};
    const str=structural(avgA,avgB);
    const osc=oscResonance(input.oscA,input.oscB);
    const tmp=temporalAlignment(input.oscA,input.oscB);
    const total=str.total*0.45+osc*0.45+tmp*0.10;
    const matchType=classifyMatch(str.total,osc,tmp,avgA,avgB);
    const insights=[];
    if(str.cognition>0.7)insights.push('Strong cognitive alignment — similar abstraction and system thinking.');
    if(str.affect>0.7)insights.push('Affective resonance — shared emotional intensity and valence.');
    if(Math.abs(avgA.affect.valence-avgB.affect.valence)>0.3)insights.push('Valence contrast — one more positive, one more negative in recent expression.');
    if(osc>0.7)insights.push('Oscillation sync — similar rhythm and amplitude of expression change.');
    if(matchType==='mirror')insights.push('Mirror resonance: high mutual recognition likely.');
    return{userA:input.userA,userB:input.userB,computedAt:Date.now(),structural:str.total,oscillation:osc,temporal:tmp,total,matchType,insights,axes:{cognition:str.cognition,affect:str.affect,language:str.language}};
  }

  return{computeResonance,makeOscProfile,avgSignal};
})();

// IDL — Intimacy Dynamics Layer
// ═══════════════════════════════════════════════════════════════
const IDL = (() => {
  function clamp(n){return Math.max(0,Math.min(1,n));}
  function mean(vs){return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:0.5;}
  function variance(vs){if(vs.length<2)return 0;const m=mean(vs);return vs.reduce((s,v)=>s+(v-m)**2,0)/vs.length;}

  function computeIntimacyVector(userId,signals){
    if(!signals.length)return null;
    const vols=signals.map(s=>s.affect.volatility);
    const atts=signals.map(s=>s.affect.attachmentLoad);
    const vals=signals.map(s=>s.affect.valence);
    const entr=signals.map(s=>s.entropy);
    const urg=signals.map(s=>s.affect.urgency);
    const rec=signals.map(s=>s.cognition.recursionDepth);
    const ints=signals.map(s=>s.intensity);
    const nar=signals.map(s=>s.language.narrativeStructure);
    const lin=signals.map(s=>s.cognition.linearity);

    // persistence
    const bondRetention=clamp(1-variance(vols)*4);
    const repairTendency=clamp(mean(atts)*0.6+mean(vals)*0.4);
    const returnLikelihood=clamp(1-variance(entr)*3);

    // elasticity
    const separationTolerance=clamp(1-mean(atts)*0.6-mean(urg)*0.4);
    const independenceStability=clamp(mean(rec)*0.5+(1-variance(ints)*3)*0.5);
    const nonCling=clamp((1-mean(atts))*0.7+(1-mean(urg))*0.3);

    // regulation
    const predictability=clamp(1-variance(vols)*4-variance(ints)*2);
    const emotionalConsistency=clamp(1-variance(vals)*4);
    const relationalPacing=clamp(mean(lin)*0.5+(1-variance(nar)*3)*0.5);

    // latency
    const internalDepth=clamp(mean(rec)*0.7+(1-mean(s=>s.affect.urgency))*0.3);
    const expressionDelay=clamp(mean(rec)*0.5+variance(ints)*2*0.5);
    const integrationTime=clamp(mean(rec)*0.4+variance(vals)*2*0.3+(1-mean(urg))*0.3);

    return{userId,computedAt:Date.now(),sampleSize:signals.length,persistence:{bondRetention,repairTendency,returnLikelihood},elasticity:{separationTolerance,independenceStability,nonCling},regulation:{predictability,emotionalConsistency,relationalPacing},latency:{internalDepth,expressionDelay,integrationTime}};
  }

  function classifyMode(v){
    const scores={};
    const pm=vs=>vs.reduce((a,b)=>a+b,0)/vs.length;
    scores['structured-devotional']=pm([v.persistence.bondRetention,v.persistence.repairTendency,v.regulation.predictability,v.regulation.emotionalConsistency]);
    scores['chaotic-attachment']=pm([1-v.regulation.predictability,1-v.regulation.emotionalConsistency,v.persistence.returnLikelihood,1-v.elasticity.separationTolerance]);
    scores['detached-autonomous']=pm([v.elasticity.separationTolerance,v.elasticity.independenceStability,v.elasticity.nonCling,v.regulation.predictability]);
    scores['deep-processor']=pm([v.latency.internalDepth,v.latency.expressionDelay,v.latency.integrationTime,v.elasticity.independenceStability]);
    scores['anxious-attacher']=pm([1-v.elasticity.separationTolerance,1-v.elasticity.nonCling,1-v.regulation.predictability]);
    scores['reciprocal-builder']=pm([v.persistence.repairTendency,v.persistence.bondRetention,pm(Object.values(v.regulation))]);
    const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
    const primary=sorted[0][0],secondary=sorted[1][0];
    return{primary,secondary,confidence:Math.round((sorted[0][1]-sorted[1][1])*100)/100+0.5,description:`Primary: ${primary} (${Math.round(sorted[0][1]*100)}%)`};
  }

  function computeRelationalDynamic(a,b,modeA,modeB){
    const d=(x,y)=>Math.abs(x-y);
    const pD=mean([d(a.persistence.bondRetention,b.persistence.bondRetention),d(a.persistence.repairTendency,b.persistence.repairTendency),d(a.persistence.returnLikelihood,b.persistence.returnLikelihood)]);
    const eD=mean([d(a.elasticity.separationTolerance,b.elasticity.separationTolerance),d(a.elasticity.independenceStability,b.elasticity.independenceStability),d(a.elasticity.nonCling,b.elasticity.nonCling)]);
    const rD=mean([d(a.regulation.predictability,b.regulation.predictability),d(a.regulation.emotionalConsistency,b.regulation.emotionalConsistency),d(a.regulation.relationalPacing,b.regulation.relationalPacing)]);
    const lD=mean([d(a.latency.internalDepth,b.latency.internalDepth),d(a.latency.expressionDelay,b.latency.expressionDelay),d(a.latency.integrationTime,b.latency.integrationTime)]);
    const overallDelta=mean([pD,eD,rD,lD]);
    const procComp=Math.max(0,1-lD*1.8);
    const regComp=rD<0.2?0.9:rD<0.4?0.7:Math.max(0.2,0.7-rD);
    const overallFit=Math.max(0,1-overallDelta*1.2);
    let type='complementary';
    if(overallDelta<0.15)type='mirroring';
    else if(modeA.primary==='structured-devotional'&&modeB.primary==='chaotic-attachment')type='stabilizing';
    else if(overallDelta>0.5)type='asymmetric';
    else if(rD>0.4)type='oscillating';
    else if(overallFit>0.6)type='complementary';
    const warnings=[];
    if(lD>0.4)warnings.push('Large processing latency gap — one partner may feel unheard before the other is ready to respond.');
    if(rD>0.4)warnings.push('Regulation mismatch — different emotional pacing may create timing friction.');
    if(eD>0.5)warnings.push('Elasticity contrast — one partner needs more contact to self-regulate.');
    return{userA:a.userId,userB:b.userId,computedAt:Date.now(),type,description:`${type} dynamic between ${a.userId} and ${b.userId}`,warnings,axes:{persistenceDelta:pD,elasticityDelta:eD,regulationDelta:rD,latencyDelta:lD},processingCompatibility:procComp,regulationCompatibility:regComp,overallFit};
  }

  return{computeIntimacyVector,classifyMode,computeRelationalDynamic};
})();

        const cx=w/2,cy=h/2,dist=Math.sqrt((x-cx)**2+(y-cy)**2);
        const skin=dist<Math.min(w,h)*.4?200:50;
        d.data[i]=skin;d.data[i+1]=Math.floor(skin*.8);d.data[i+2]=Math.floor(skin*.7);d.data[i+3]=255;
      } else if(type==='dark'){
        d.data[i]=20;d.data[i+1]=20;d.data[i+2]=25;d.data[i+3]=255;
      } else if(type==='bright'){
        d.data[i]=230;d.data[i+1]=235;d.data[i+2]=240;d.data[i+3]=255;
      } else if(type==='gradient'){
        d.data[i]=Math.floor(x/w*255);d.data[i+1]=Math.floor(y/h*255);d.data[i+2]=128;d.data[i+3]=255;
      } else if(type==='noise'){
        const v=Math.floor(Math.random()*255);d.data[i]=v;d.data[i+1]=v;d.data[i+2]=v;d.data[i+3]=255;
      } else if(type==='motion'){

  }

  // PCM → WAV blob (minimal header)
  function pcmToWavBlob(pcm,sr=44100){
    const n=pcm.length,bytesPerSample=2,channels=1;
    const buf=new ArrayBuffer(44+n*bytesPerSample);
    const view=new DataView(buf);
    function ws(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}
    ws(0,'RIFF');view.setUint32(4,36+n*bytesPerSample,true);ws(8,'WAVE');ws(12,'fmt ');

  }

  // Text documents of various types
  const docs={

    abstract:`The constraint field runtime emerges from a core inversion: instead of telling the computer what to do, you define what equilibrium looks like. The physics finds it. Fidelity resists entropy. Attention amplifies signal. Selection prunes noise. What you observe is not programmed — it is the natural consequence of competing forces finding their minimum energy configuration across N dimensions simultaneously.`,

    relational:`I need you to understand that when you go quiet, I don't know what it means. My whole system goes on alert. I start running through everything I said, checking for what broke it. I know that's my pattern, not yours — I'm not saying it's your fault. But I need us to find a signal. Something that tells me we're still okay.`,

    therapy_note:`Session 12. Client arrived visibly dysregulated — shallow breathing, avoiding eye contact. Reported waking at 3am with 'the voice' — internal critic cataloguing inadequacies. When asked what the voice sounds like, long pause. 'It sounds like no one particular. Just absolute certainty.' Worked with parts language. Some defusion. Left more grounded. Homework: notice when the voice uses 'always' or 'never'.`
  };

      return[Nexus.gateOutput('test.gate.resonance.mirror',{users:`${ev.payload.userA}↔${ev.payload.userB}`,total:ev.payload.total},{source:'gate:resonance-mirror',causedBy:ev.id,edgeType:Nexus.EDGE_RULE})];
    }
    return[];
  },40);

  function emit(type,payload,meta){return kernel.ingest(type,payload??{},meta??{});}
  function getAll(){return kernel.getAll();}

  function typeClass(type){
    if(type.includes('media')||type.includes('video')||type.includes('audio')||type.includes('screenshot')||type.includes('wav')||type.includes('png')||type.includes('frame'))return 't-media';
    if(type.includes('ase'))return 't-ase';
    if(type.includes('resonance'))return 't-resonance';
    if(type.includes('idl'))return 't-idl';
    if(type.includes('heuristic')||type.includes('extract')||type.includes('signal'))return 't-heuristic';
    if(type.includes('gate'))return 't-gate';
    if(type.includes('error')||type.includes('fail'))return 't-error';
    return 't-heuristic';
  }

  function setFilter(f){logFilter=f;renderLog();}

  function renderLog(){
    const events=kernel.getAll();
    const filtered=logFilter==='all'?events:events.filter(ev=>{
      const tc=typeClass(ev.type);
      if(logFilter==='error')return tc==='t-error'||ev.type.includes('error');
      return tc==='t-'+logFilter;
    });
    const stream=document.getElementById('log-stream');
    if(!stream)return;
    stream.innerHTML='';
    const slice=filtered.slice(-400);
    for(const ev of slice){
      const div=document.createElement('div');
      div.className='log-ev '+typeClass(ev.type);
      const parts=ev.type.split('.');
      const ns=parts.slice(0,2).join('.');const name=parts.slice(2).join('.');
      const payStr=JSON.stringify(ev.payload).slice(0,90);
      div.innerHTML=`<span class="ts">${Nexus.formatTs(ev.ts)}</span><div><div class="etype"><span class="ns">${ns}.</span>${name}${ev.causedBy?` <span style="color:var(--text3)">← ${Nexus.shortId(ev.causedBy)}</span>`:''}</div><div class="epay">${payStr}</div></div>`;
      stream.appendChild(div);
    }
    stream.scrollTop=stream.scrollHeight;
    const ec=document.getElementById('ev-count');
    if(ec)ec.textContent=events.length;
  }

  let renderTimer=null;
  kernel.subscribe(()=>{clearTimeout(renderTimer);renderTimer=setTimeout(renderLog,60);});

  return{emit,getAll,setFilter,kernel};
})();

    const grp=document.createElement('div');grp.className='suite-group';
    const head=document.createElement('div');head.className='suite-head';
    head.innerHTML=`<span class="dot" style="background:${suite.color}"></span>${suite.name}`;
    grp.appendChild(head);
    for(const fn of suite.tests){
      total++;
      const item=document.createElement('div');item.className='test-item';item.id='ti-'+fn.name;
      item.innerHTML=`<span class="status" id="st-${fn.name}">◌</span>${fn.name.replace(/_/g,' ')}<span class="dur" id="dr-${fn.name}"></span>`;
      item.onclick=()=>showResult(fn.name);
      grp.appendChild(item);
      _allTests.push({fn,suite});
    }
    sb.appendChild(grp);
  }
  document.getElementById('c-total').textContent=total;
}

function showResult(name){
  document.querySelectorAll('.test-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('ti-'+name)?.classList.add('active');
  const r=_testResults.get(name);
  const suite=_allTests.find(t=>t.fn.name===name)?.suite;
  document.getElementById('th-name').textContent=name.replace(/_/g,' ');
  const meta=document.getElementById('th-meta');
  if(r){
    const pass=r.results.filter(x=>x.pass===true).length,fail=r.results.filter(x=>x.pass===false).length;
    meta.innerHTML=`<span class="meta-tag ${r.pass?'pass':'fail'}">${r.pass?'✓ PASS':'✗ FAIL'}</span><span class="meta-tag">${suite?.name||''}</span><span class="meta-tag">${Math.round(r.dur)}ms</span><span class="meta-tag">${pass}/${pass+fail} assertions</span>`;
  } else {
    meta.innerHTML=`<span class="meta-tag run">◌ pending</span><span class="meta-tag">${suite?.name||''}</span>`;
  }
  renderResults(name);
}

function renderResults(name){
  const container=document.getElementById('results');container.innerHTML='';
  const r=_testResults.get(name);if(!r)return;
  for(const res of r.results){
    const row=document.createElement('div');
    const cls=res.type==='info'?'info':res.type==='warn'?'warn':res.type==='media'?'media':res.pass?'pass':'fail';
    row.className='result-row '+cls;
    const icon=res.type==='info'?'◈':res.type==='warn'?'⚠':res.type==='media'?'▣':res.pass?'✓':'✗';
    let body='';
    if(res.type==='info'||res.type==='media'){
      body=`<span class="label">${res.name}:</span> <span class="val ${res.type==='media'?'cyan':'blue'}">${typeof res.got==='string'?res.got:JSON.stringify(res.got)??''}</span>`;
    } else if(res.type==='warn'){
      body=`<span class="val warn">⚠ ${res.name}</span>`;
    } else {
      const vc=res.pass?'val':'val bad';
      body=`${res.name} — got <span class="${vc}">${JSON.stringify(res.got)}</span>`;
      if(res.expected!==undefined&&!res.pass)body+=` expected <span class="val">${JSON.stringify(res.expected)}</span>`;
    }
    row.innerHTML=`<span class="icon">${icon}</span><div class="body">${body}</div><span class="dur">${res.dur>0?Math.round(res.dur)+'ms':''}</span>`;
    container.appendChild(row);
  }
}

function updateSidebarItem(name,pass,dur){
  const item=document.getElementById('ti-'+name);
  const st=document.getElementById('st-'+name);
  const dr=document.getElementById('dr-'+name);
  if(item){item.classList.remove('running');item.classList.add(pass?'pass':'fail');}
  if(st)st.textContent=pass?'✓':'✗';
  if(dr)dr.textContent=Math.round(dur)+'ms';
}

async function runAll(){
  if(_running)return;
  _running=true;_pass=0;_fail=0;
  const btn=document.getElementById('run-btn');
  btn.textContent='◼ RUNNING';btn.className='running';
  document.getElementById('c-pass').textContent='0';
  document.getElementById('c-fail').textContent='0';
  const total=_allTests.length;
  const bar=document.getElementById('progress-bar');

  for(let i=0;i<total;i++){
    const{fn,suite}=_allTests[i];
    const item=document.getElementById('ti-'+fn.name);
    if(item){item.classList.add('running');item.scrollIntoView({behavior:'smooth',block:'nearest'});}
    const t0=performance.now();
    let results=[],pass=true;
    try{results=await fn();}catch(e){results=[{name:'Uncaught: '+e.message,pass:false,got:e.stack?.split('\n')[1]||e.message,expected:'no error',type:'assert'}];LOG.emit('test.error',{name:fn.name,error:e.message},{source:'test.runner'});}
    const dur=performance.now()-t0;
    if(results.some(r=>r.pass===false))pass=false;
    _testResults.set(fn.name,{results,pass,dur});
    updateSidebarItem(fn.name,pass,dur);
    if(pass)_pass++;else _fail++;
    document.getElementById('c-pass').textContent=_pass;
    document.getElementById('c-fail').textContent=_fail;
    bar.style.width=((i+1)/total*100)+'%';
    showResult(fn.name);
    await new Promise(r=>setTimeout(r,5));
  }

  btn.textContent='▶ RUN ALL';btn.className='';btn.disabled=false;
  _running=false;
  bar.style.background=_fail>0?'var(--c1)':'var(--c0)';
  LOG.emit('test.suite.complete',{pass:_pass,fail:_fail,total,passRate:Math.round(_pass/total*100)+'%'},{source:'test.runner'});
}

window.runAll=runAll;
buildSidebar();
showResult(_allTests[0]?.fn?.name);
</script>
</body>
</html>
