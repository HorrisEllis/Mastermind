phil:"Impossible love in 4k. My philosophy on love is one you create with another. Two souls co-creating their own book, on reverent love. A nuanced authentically beautiful, and principled kind love that radiates with such warmth and vibrance it could outshine the rays of the cosmos. Affection that feels so intentional, so vibrational, that every act will emit embers swelling into flame. A feeling so passionate that the universe completely melts. It is no longer about the body, two souls have merged in perfect harmony with maintaining sovereignty. Love deeper than the Mariana trench. The gentleness of holding each other hearts, in the slow quiet mornings. I woke up today flowing in rhyme, letting my intuition guide. I am taking the universes direction this time. I feel a deep pull toward you and I cannot tell you why. I have plenty of logical reasons but none of them fully explain why. Love, logic, or resonance. I am done trying to hide. I speak duality, but I promise I am anchored in reality. I cannot stop speaking from my heart all I can do is try to make art. Trying to go with the flow and let everything else go. Where is this path going who knows. I hope this does not push you away but if you leave it is not meant for me anyways. I hate that I am writing this way, especially because how afraid I am to express myself to you anyways. I want to love you like we are writing a philosophy, a book on love and choosing our meaning. Love is a scary thing not always stable, but sometimes it is worth the gamble. I am who I am and I am done trying to explain. My existence is none of your business. I have lots of beauty and lots of darkness but they now are integrating like two sentences that rhyme in real time. I remember who I am and who I want to be. If you disrupt my energy, I no longer have need. If your love is transactional or conditional, give it to yourself. My intuition is now working without limitations. My light is my source, my empathy is my compass and the universe is my guide. We are not outcasts, not rejects nor are we aliens from another planet. We are rare gems that most people often overlook, not realizing the light, clarity and beauty that resides in the depth of our shadow. Creativity and authentic expression is our most deadliest weapon. Even when people refuse to listen, it is the words, the art, the ideas, the inspiration we leave behind. Art is the legacy of the truly awoken. Masks are the enemy of true independence, individuality, truth and liberation. I finally feel the shackles opening, as well as my mind fully. Caring too much is considered broken, loving with intensity is considered crazy. Being loyal is considered rare. We live our truth while others cannot even speak it. We live in a depth most people cannot comprehend. Authenticity, the loneliest aspect of our personality, apart from our intellect. Pain is life best teacher in the classroom of life, second only to love. Love is often life greatest lesson, but the pain is where the real learning begins, if you are brave enough to listen. Set yourself free, but be warned, there is no more escaping from reality. Pain and love always coincide, so much beauty in the duality of misery, because love always grows from pain. I needed to understand heartbreak to learn what true love feels like. The more we hurt, the bigger our capacity to love. I needed to be invisible before I could know what it feels like to be truly seen. I needed to experience loss and heartbreak before I could ever love truly. I needed to be rejected before I could feel what it is like to be truly accepted. I needed to be alone, feel the peak of loneliness, so that I truly find the people that belong in my life. True love to me, is kind, patient, gentle, empathetic, understanding, and forgiving, even when it is the hardest. Every second spent feels worth it, even on the days the weather is the worst. It feels like acceptance, safety, and finally being home. It is making space for feelings and different perspectives. It is teamwork, never a competition. It is putting ego aside to shut up and truly listen. It is guiding and being guided, never fixing or forcing. It is honest, transparent, devoted, loyal. It is working together to conquer anything. Taking accountability, acknowledging when you are wrong, when you have hurt them, and actually working on it. The amount of time the pendulum swings to the left is directly proportional to the amount of time it takes to swing to the right. Cause and effect. Rhythm and rhyme. The dividing middle line, is either control or flow depending on the ability to surrender the illusion of it. Patterns predict the outcome. Intuition guides your intention. Life, relationships, everything is a mirror. A life without suffering would be a life without meaning, would be a life without true love. Two things in life that motivate people. Love or fear. Fear of pain, fear of death, fear of judgement, fear of disappointment, fear of abandonment, fear of being alone. Fear is my cage, love is what guides me. I see life as a sandbox and a laboratory. Every experience, every emotion, every challenge is a tool to test, learn, and grow. Nothing is inherently good or bad. I am both observer and participant in my mind. I do not command, I mediate. I honor all parts of myself, even the shadow, because every fragment has something to teach me. I protect my sense of self without building walls. I allow fluidity, but I anchor where it matters. I am my own best friend, my own guide, my own scientist. I seek depth over surface, authenticity over comfort. Love is my legacy, connection my measure of meaning. I choose to grow, to observe, to alchemize my experience into wisdom.",

o silent observers, analyzing the universe. Searching for love and all of its meaning, guided by their intuition. Until one day a collision, finally they have completed their lifelong journey. What forces we are. Unstoppable, unmovable forces will we be together, finally in perfect harmony, fully aligned, learning and growing. We are our own light, our safety, love that will always fill each other hearts. The electricity that fills your body after a fulfilling conversation. The feeling of meeting someone who finally speaks your language, the feeling of truly belonging. The tall beautiful trees that fill a forest, the sounds of the leaves as they are greeted by the wind. The sun reflecting as it sets over the ocean, breathtaking like the smile on your face when you laugh. The warmth of a fireplace on a freezing day, like a warm embrace, the way your love feels. A volcano on the verge of eruption, the pressure, the tension, like holding my lips right up to yours. How can you be happy when you look out and see infinity. You find another diamond, who resonates at the exact same frequency. Two rebels, reaching for a cause. Instead they find each other, which is incomparably better. Two lovers, two diamonds, two empowered outcasts. Two black swans manifesting and being guided towards themselves, pulled like quantum entanglement. Expanding, not shrinking, a shared path of meaning. Home is not a place, it is each other. My life an endless labyrinth, I am falling suddenly. My suffering is limitless, my bitterness is creeping and I am slowly losing to the nihilist. The embers fading and my love is not enough. A lifetime of memories and the pain that still haunts me. I am burned out, exhausted. Self-regulation turned isolation. My love for you, as vast as the ocean, as warm as the sun. The love was real, so was the pain that followed. We deserved each other, but we never felt like it. We grew for each other, but also still somehow apart. I grieve the love we deserved, the future desired and depth that was built so fast. I love you like fish loves the ocean, like a premonition meant to happen. We are the destination, us in each other arms. My heart the size of the solar system, loves like an ocean. I move like a team, an ever-evolving ecosystem. I choose a life with meaning, walking with intention. I live life like a philosopher. I approach like an engineer. I learn like a scientist. My words leave my mind like a poet, grounded in truth. Art and science, one and the same. Empathy and intellect, born from the same mother. Light and darkness, not enemies, merely misunderstood polarity. Like yin and yang, dancing for eternity. The peaceful outcast, alone at last. Back to protecting his energy. Fully immersed in the serenity, the harmony coming from his inner sanctuary."

var TG = {deepening:"↗",dissolving:"↘",stable:"→",emerging:"◈",unknown:"·"};

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function cntW(words,list){var c=0;for(var i=0;i<list.length;i++)if(words.indexOf(list[i])>-1)c++;return c;}
function cntT(text,list){var c=0;for(var i=0;i<list.length;i++)if(text.indexOf(list[i])>-1)c++;return c;}
function avg(arr){if(!arr.length)return 0;var s=0;for(var i=0;i<arr.length;i++)s+=arr[i];return s/arr.length;}

// ═══════════════════════════════════════════
// 6-LAYER ANALYSIS ENGINE
// ═══════════════════════════════════════════
function analyse(key){
  var text = TEXTS[key];
  var lower = text.toLowerCase();
  var sentences = text.split(/[.!?]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>4;});
  var words = lower.replace(/[^a-z\s]/g," ").split(/\s+/).filter(function(w){return w.length>1;});
  var content = words.filter(function(w){return !STOP[w];});
  var n = words.length, sn = sentences.length;

  // ── LAYER 1: MICRO-LINGUISTIC (unconscious) ─────────
  // Function word distribution (Pennebaker method)
  var iCount=0,weCount=0,youCount=0,theyCount=0;
  for(var j=0;j<words.length;j++){
    if(words[j]==="i")iCount++;
    else if(words[j]==="we"||words[j]==="us"||words[j]==="our")weCount++;
    else if(words[j]==="you"||words[j]==="your"||words[j]==="yours")youCount++;
    else if(words[j]==="they"||words[j]==="them"||words[j]==="their")theyCount++;
  }
  var totalPron=iCount+weCount+youCount+theyCount+1;
  var iRatio=iCount/totalPron, weRatio=weCount/totalPron, youRatio=youCount/totalPron;

  // Sentence onset classes
  var onsetI=0,onsetConj=0,onsetNoun=0,onsetVerb=0;
  var conjSet={and:1,but:1,or:1,so:1,yet:1,for:1,nor:1,because:1,although:1,however:1,when:1,if:1,while:1,since:1,though:1};
  var verbSet={is:1,was:1,are:1,were:1,have:1,had:1,do:1,did:1,get:1,got:1,feel:1,felt:1,find:1,found:1,know:1,knew:1,love:1,loved:1,need:1,want:1,become:1,live:1,move:1,choose:1,see:1,walk:1,stand:1,hold:1};
  for(var s=0;s<sentences.length;s++){
    var fw=sentences[s].toLowerCase().split(/\s+/)[0];
    if(fw==="i")onsetI++;
    else if(conjSet[fw])onsetConj++;
    else if(verbSet[fw])onsetVerb++;
    else onsetNoun++;
  }
  var onsetTotal=sn||1;

  // Type-Token Ratio (vocabulary diversity)
  var unique={};for(var j=0;j<content.length;j++)unique[content[j]]=1;
  var ttr=Object.keys(unique).length/(content.length||1);

  // Hapax legomena (words used exactly once)
  var freq={};for(var j=0;j<content.length;j++)freq[content[j]]=(freq[content[j]]||0)+1;
  var hapax=0;for(var w in freq)if(freq[w]===1)hapax++;
  var hapaxRatio=hapax/(content.length||1);

  // Average word length
  var totalChars=0;for(var j=0;j<words.length;j++)totalChars+=words[j].length;
  var avgWordLen=totalChars/(n||1);

  // Verb tense mixing within sentences (dissociation signal)
  var pastV={was:1,were:1,had:1,did:1,felt:1,knew:1,loved:1,lost:1,broke:1,became:1,went:1,grew:1,saw:1,found:1,heard:1,thought:1,believed:1};
  var presV={is:1,are:1,have:1,feel:1,know:1,love:1,lose:1,break:1,become:1,go:1,grow:1,see:1,find:1,hear:1,think:1,believe:1,am:1};
  var tenseMixSents=0;
  for(var s=0;s<sentences.length;s++){
    var sw=sentences[s].toLowerCase().split(/\s+/);
    var hasPast=false,hasPres=false;
    for(var j=0;j<sw.length;j++){if(pastV[sw[j]])hasPast=true;if(presV[sw[j]])hasPres=true;}
    if(hasPast&&hasPres)tenseMixSents++;
  }
  var tenseMix=tenseMixSents/(sn||1);

  // ── LAYER 2: STRUCTURAL INVARIANTS ─────────────────
  // Coordination vs subordination
  var coordW=["and","but","or","nor","yet","so","for"];
  var subordW=["because","although","though","since","unless","while","whereas","if","when","before","after","until","as","despite","however","therefore","thus","hence"];
  var coordC=cntW(words,coordW), subordC=cntW(words,subordW);
  var coordRatio=coordC/(coordC+subordC+1);

  // Sentence length variance
  var sentLens=sentences.map(function(s){return s.split(/\s+/).length;});
  var avgLen=avg(sentLens);
  var lenVar=0;for(var i=0;i<sentLens.length;i++)lenVar+=(sentLens[i]-avgLen)*(sentLens[i]-avgLen);
  lenVar=Math.sqrt(lenVar/(sentLens.length||1));
  var staccato=sentLens.filter(function(l){return l<=4;}).length/(sn||1);

  // Resolution distance
  var painIdxs=[],resolveIdxs=[];
  var painSet={pain:1,hurt:1,grief:1,broken:1,alone:1,lost:1,empty:1,dark:1,scream:1,void:1,fear:1,suffer:1,wound:1};
  var resolveSet={heal:1,learn:1,grow:1,accept:1,peace:1,free:1,understand:1,integrate:1,forgive:1,become:1,transform:1,alchemize:1};
  for(var s=0;s<sentences.length;s++){
    var sw=sentences[s].toLowerCase().split(/\s+/);
    for(var j=0;j<sw.length;j++){
      if(painSet[sw[j]]){painIdxs.push(s);break;}
    }
    for(var j=0;j<sw.length;j++){
      if(resolveSet[sw[j]]){resolveIdxs.push(s);break;}
    }
  }
  var resDists=[];
  for(var p=0;p<painIdxs.length;p++){
    var nearest=999;
    for(var r=0;r<resolveIdxs.length;r++){
      var d=resolveIdxs[r]-painIdxs[p];
      if(d>0&&d<nearest)nearest=d;
    }
    if(nearest<999)resDists.push(nearest);
  }
  var avgResDist=resDists.length?avg(resDists):null;

  // Topic entropy per passage (5 bands)
  var TFIELDS={SELF:["i","me","my"],OTHER:["you","your","they","her","him"],BODY:["body","hands","eyes","skin","breath"],EMOTION:["love","pain","fear","grief","joy","hurt"],COSMIC:["universe","infinite","cosmos","eternal","transcend"],SOCIAL:["people","world","society","others","everyone"],GROWTH:["learn","grow","heal","integrate","become"]};
  var bandSize=Math.ceil(sn/5);
  var topicEntropies=[];
  for(var b=0;b<5;b++){
    var band=sentences.slice(b*bandSize,(b+1)*bandSize).join(" ").toLowerCase().split(/\s+/);
    var fieldCounts=[];
    for(var f in TFIELDS){var c=0;for(var j=0;j<TFIELDS[f].length;j++)for(var k=0;k<band.length;k++)if(band[k]===TFIELDS[f][j])c++;fieldCounts.push(c);}
    var total=fieldCounts.reduce(function(a,b){return a+b;},0)||1;
    var entropy=0;
    for(var i=0;i<fieldCounts.length;i++){var p=fieldCounts[i]/total;if(p>0)entropy-=p*Math.log(p+0.001);}
    topicEntropies.push(entropy/2);
  }
  var avgTopicEntropy=avg(topicEntropies);

  // ── LAYER 3: EMOTIONAL TOPOLOGY ────────────────────
  // Co-occurrence: opposite valence words within 5-word windows
  var coocPairs=[];
  var coocCounts={};
  for(var j=5;j<words.length-5;j++){
    var window=words.slice(j-5,j+5);
    if(PVAL[words[j]]){
      for(var k=j-5;k<j+5;k++){
        if(k!==j&&NVAL[words[k]]){
          var pair=words[j]+"+"+words[k];
          coocCounts[pair]=(coocCounts[pair]||0)+1;
        }
      }
    }
  }
  var topCooc=Object.keys(coocCounts).sort(function(a,b){return coocCounts[b]-coocCounts[a];}).slice(0,8);
  var coocTotal=Object.keys(coocCounts).length;

  // Polarity bridging sentences
  var bridgeSents=0;
  for(var s=0;s<sentences.length;s++){
    var sw=sentences[s].toLowerCase().split(/\s+/);
    var hasp=false,hasn=false;
    for(var j=0;j<sw.length;j++){if(PVAL[sw[j]])hasp=true;if(NVAL[sw[j]])hasn=true;}
    if(hasp&&hasn)bridgeSents++;
  }
  var polarityBridge=bridgeSents/(sn||1);

  // Peak emotional word and its context
  var allEmotional={};
  for(var j=0;j<words.length;j++){
    if(PVAL[words[j]]||NVAL[words[j]]||HAROUSAL[words[j]]){
      allEmotional[words[j]]=(allEmotional[words[j]]||0)+1;
    }
  }
  var peakWord="",peakCount=0;
  for(var w in allEmotional){if(allEmotional[w]>peakCount){peakCount=allEmotional[w];peakWord=w;}}
  // context around peak word (first occurrence)
  var peakCtx="";
  var pi=words.indexOf(peakWord);
  if(pi>-1)peakCtx=words.slice(Math.max(0,pi-4),pi+5).join(" ");

  // Grief vs depression vs rage discrimination
  var griefW=["grief","grieve","grieiving","loss","mourn","mourning","miss","missing","gone","absence","ache","aching","longing","yearn","hollow"];
  var deprW=["numb","empty","hollow","nothing","lifeless","dead","void","pointless","meaningless","hopeless","futile","what for","no reason","keep going","reason to"];
  var rageW=["anger","angry","rage","furious","scream","shout","hate","destroy","burn","fight","war","weapon","wrath","defy","defiance"];
  var griefScore=cntT(lower,griefW)/(sn||1);
  var deprScore=cntT(lower,deprW)/(sn||1);
  var rageScore=cntT(lower,rageW)/(sn||1);

  // Emotional repetition: does author re-intensify or decay on repeated use?
  var firstHalfWords=words.slice(0,Math.floor(n/2));
  var secondHalfWords=words.slice(Math.floor(n/2));
  var fhIntense=firstHalfWords.filter(function(w){return HAROUSAL[w];}).length/Math.max(firstHalfWords.length,1);
  var shIntense=secondHalfWords.filter(function(w){return HAROUSAL[w];}).length/Math.max(secondHalfWords.length,1);
  var intensityDrift=shIntense-fhIntense;

  // ── LAYER 4: IDENTITY CONSISTENCY ──────────────────
  // Core metaphor presence
  var metaphorScores={};
  for(var m in METAPHORS){
    var mc=cntT(lower,METAPHORS[m]);
    metaphorScores[m]=mc;
  }
  var topMetaphors=Object.keys(metaphorScores).sort(function(a,b){return metaphorScores[b]-metaphorScores[a];}).slice(0,5);

  // Self-concept poles: how author describes self across emotional states
  var elevW=["rare","gem","diamond","sovereign","awoken","philosopher","engineer","scientist","poet","god","divine","power","depth","intellect","light","guide","compass","legacy"];
  var condemnW=["broken","crazy","lunatic","mediocre","wrong","not enough","lost","failure","nothing","pathetic","worthless","ravings","delusional"];
  var elevC=cntW(words,elevW),condemnC=cntW(words,condemnW);
  var selfConceptOscillation=Math.min(1,(Math.min(elevC,condemnC)*2)/(Math.max(elevC,condemnC)+1));

  // Value-enactment gap: stated values vs actual word frequency
  var statedValues=["truth","authenticity","love","empathy","integrity","depth","honesty","loyalty","freedom","growth"];
  var valueFreq={};
  for(var i=0;i<statedValues.length;i++){
    var vw=statedValues[i];
    valueFreq[vw]=words.filter(function(w){return w===vw;}).length;
  }
  var topValues=Object.keys(valueFreq).sort(function(a,b){return valueFreq[b]-valueFreq[a];}).slice(0,5);

  // Other-representation: how is the romantic other described
  var ravenPositive=cntT(lower,["raven","her light","she heals","she loves","she sees","beautiful","vibrant","princess","goddess","diamond"]);
  var ravenWounded=cntT(lower,["injured raven","wounded","broken","hurt","she screams","her pain","her darkness","her void"]);
  var otherRep=ravenPositive>ravenWounded?"IDEALIZED":(ravenWounded>ravenPositive?"WOUNDED":"BALANCED");

  // ── LAYER 5: PATHOLOGY vs DEPTH ────────────────────
  // Integration ratio: darkness words near growth words within 10-word windows
  var integratedCount=0,isolatedDark=0;
  for(var j=0;j<words.length;j++){
    if(NVAL[words[j]]){
      var win=words.slice(Math.max(0,j-10),j+10);
      var hasGrowth=false;
      for(var k=0;k<win.length;k++){if(GROWTH_W.indexOf(win[k])>-1){hasGrowth=true;break;}}
      if(hasGrowth)integratedCount++;
      else isolatedDark++;
    }
  }
  var integrationRatio=integratedCount/(integratedCount+isolatedDark+1);

  // Locus of control
  var internalLocus=cntT(lower,AGENCY_W);
  var externalLocus=cntT(lower,EXTERNAL_W);
  var locusScore=internalLocus/(internalLocus+externalLocus+1);

  // Stuckness index
  var stucknessCount=cntW(words,STUCK_W);
  var stucknessScore=Math.min(1,stucknessCount/(sn||1)*2);

  // PTG markers
  var ptgCount=cntT(lower,PTG_W);
  var ptgScore=Math.min(1,ptgCount/(sn||1)*3);

  // Bypass detection: pain-to-resolution in 1 sentence
  var bypassCount=0;
  for(var s=0;s<sentences.length;s++){
    var sw=sentences[s].toLowerCase().split(/\s+/);
    var hasPain=false,hasResolve=false;
    for(var j=0;j<sw.length;j++){if(painSet[sw[j]])hasPain=true;if(resolveSet[sw[j]])hasResolve=true;}
    if(hasPain&&hasResolve)bypassCount++;
  }
  var bypassRatio=bypassCount/(sn||1);

  // ── BASE VECTOR ─────────────────────────────────────
  var ha=0,la=0,pw=0,nw=0,fp=0;
  for(var j=0;j<words.length;j++){
    if(HAROUSAL[words[j]])ha++;
    if(LAROUSAL[words[j]])la++;
    if(PVAL[words[j]])pw++;
    if(NVAL[words[j]])nw++;
    if(words[j]==="i")fp++;
  }
  var arousal=Math.max(0,Math.min(1,(ha-la*0.3)/(n*0.05+1)));
  var valence=Math.max(0,Math.min(1,(pw-nw)/(pw+nw+1)*0.5+0.5));
  var maskw=["try","despite","but","though","however","while","although","afraid","hiding","anyways"];
  var masks=cntW(words,maskw);
  var supp=Math.min(1,masks/10);
  var lex=content.length/(n+1);
  var connw=["therefore","because","although","however","thus","so"];
  var conn=cntW(words,connw);
  var coher=Math.min(1,lex*1.3+conn/25);
  var eng=Math.min(1,(fp/n)*3);
  var vec=[arousal,valence,supp,coher,eng];
  var tc=0;for(var i=0;i<5;i++)tc+=vec[i]/5;
  var rp=0;for(var i=0;i<5;i++)rp+=(vec[i]-tc)*(vec[i]-tc);rp=Math.sqrt(rp/5);

  // ── SCHEMA SCORES ───────────────────────────────────
  var schemaScores={};
  for(var s in SCHEMAS)schemaScores[s]=Math.min(1,cntT(lower,SCHEMAS[s].w)/(sn||1)*3);

  // ── SIGMA SCORES ────────────────────────────────────
  var sigmaScores={};
  for(var s in SIGMA){
    var raw=cntT(lower,SIGMA[s].w)/(n||1)*100;
    sigmaScores[s]=Math.min(2,raw/(SIGMA[s].base*100));
  }
  var elevCondOsc=selfConceptOscillation;

  // ── CONDITIONING ────────────────────────────────────
  var condScores={};
  for(var c in CONDITIONING)condScores[c]=Math.min(1,cntT(lower,CONDITIONING[c].w)/(sn||1)*2);

  // ── SHAPE ───────────────────────────────────────────
  var bandSz=Math.ceil(sn/5),densityBands=[];
  for(var b=0;b<5;b++){
    var band=sentences.slice(b*bandSz,(b+1)*bandSz).join(" ");
    var bw=band.toLowerCase().split(/\s+/);
    var bc=bw.filter(function(w){return !STOP[w]&&w.length>2;}).length;
    densityBands.push(Math.min(1,bc/(bw.length||1)*1.5));
  }
  var voltaIdx=0,maxVoltaShift=0;
  for(var s=1;s<sentences.length;s++){
    var prev=sentences.slice(Math.max(0,s-3),s).join(" ").toLowerCase().split(/\s+/);
    var curr=sentences.slice(s,s+3).join(" ").toLowerCase().split(/\s+/);
    var pp=0,pn=0,cp=0,cn=0;
    for(var j=0;j<prev.length;j++){if(PVAL[prev[j]])pp++;if(NVAL[prev[j]])pn++;}
    for(var j=0;j<curr.length;j++){if(PVAL[curr[j]])cp++;if(NVAL[curr[j]])cn++;}
    var shift=Math.abs(((cp-cn)/(cp+cn+1))-((pp-pn)/(pp+pn+1)));
    if(shift>maxVoltaShift){maxVoltaShift=shift;voltaIdx=s/sn;}
  }
  var rhythmBands=[];
  var rbSz=Math.ceil(sn/16);
  for(var b=0;b<16;b++){
    var band=sentences.slice(b*rbSz,(b+1)*rbSz).join(" ");
    var syls=(band.match(/[aeiou]+/gi)||[]).length;
    var wc=band.split(/\s+/).length;
    rhythmBands.push(Math.min(1,(syls/(wc||1))/2));
  }

  // ── CONVERGENCE VERDICT ─────────────────────────────
  // 6 independent streams each render a signal
  // Verdict = what they agree on
  var stream1_selfFocus = iRatio > 0.35 ? "HIGH" : iRatio > 0.22 ? "MOD" : "LOW";
  var stream2_causalThink = coordRatio < 0.6 ? "CAUSAL" : "ADDITIVE";
  var stream3_integration = integrationRatio > 0.45 ? "INTEGRATED" : integrationRatio > 0.25 ? "PARTIAL" : "ISOLATED";
  var stream4_topMetaphor = topMetaphors[0];
  var stream5_locus = locusScore > 0.55 ? "INTERNAL" : locusScore > 0.4 ? "MIXED" : "EXTERNAL";
  var stream6_ptg = ptgScore > 0.15 ? "GROWTH" : stucknessScore > 0.3 ? "STUCK" : "PROCESSING";

  // Agreement logic
  var verdictSignals=[];
  if(stream3_integration==="INTEGRATED"&&stream5_locus==="INTERNAL"&&stream6_ptg==="GROWTH")
    verdictSignals.push("ACTIVE METABOLIZATION — darkness is being processed, not inhabited");
  if(schemaScores.ABANDONMENT>0.3&&schemaScores.DEPRIVATION>0.3)
    verdictSignals.push("EARLY EMOTIONAL DEPRIVATION — consistent across linguistic and semantic streams");
  if(selfConceptOscillation>0.35)
    verdictSignals.push("IDENTITY COHERENCE SPLIT — self-elevation and self-condemnation coexist at measurable frequency");
  if(coocTotal>15)
    verdictSignals.push("POLARITY INTEGRATION — opposing emotional valences frequently co-located in writing (not separated)");
  if(condScores.LIBERATION>0.3&&condScores.APPROVAL_SEEK>0.2)
    verdictSignals.push("LIBERATION IN PROGRESS — defiance and approval-seeking coexist, suggesting active uncoupling from conditioning");
  if(ttr>0.7)
    verdictSignals.push("HIGH COGNITIVE FLEXIBILITY — vocabulary diversity above 70% type-token ratio");
  if(ptgScore>0.15&&integrationRatio>0.35)
    verdictSignals.push("POST-TRAUMATIC GROWTH MARKERS PRESENT — pain consistently near meaning-making language");
  if(bypassRatio>0.3)
    verdictSignals.push("REFRAME VELOCITY HIGH — pain resolved within same sentence at "+Math.round(bypassRatio*100)+"% rate (possible bypass)");
  if(avgResDist&&avgResDist<3)
    verdictSignals.push("SHORT RESOLUTION DISTANCE ("+avgResDist.toFixed(1)+" sentences avg) — processing speed may indicate bypass or genuine integration");

  // ── TAGS ────────────────────────────────────────────
  var tags=[], alertTags=[], affirmTags=[];
  // Affirm
  if(integrationRatio>0.45)affirmTags.push("PAIN INTEGRATED");
  if(ptgScore>0.15)affirmTags.push("POST-TRAUMATIC GROWTH");
  if(ttr>0.65)affirmTags.push("HIGH COGNITIVE FLEXIBILITY");
  if(locusScore>0.55)affirmTags.push("INTERNAL LOCUS");
  if(polarityBridge>0.25)affirmTags.push("POLARITY BRIDGING");
  if(condScores.LIBERATION>0.3)affirmTags.push("LIBERATION DRIVE");
  if(coocTotal>10)affirmTags.push("EMOTIONAL COMPLEXITY");
  // Alert
  if(schemaScores.ABANDONMENT>0.35)alertTags.push("ABANDONMENT SCHEMA");
  if(schemaScores.DEFECTIVENESS>0.25)alertTags.push("DEFECTIVENESS SCHEMA");
  if(schemaScores.ENTRAPMENT>0.25)alertTags.push("ENTRAPMENT SCHEMA");
  if(schemaScores.DEPRIVATION>0.3)alertTags.push("EMOTIONAL DEPRIVATION");
  if(selfConceptOscillation>0.35)alertTags.push("SELF-CONCEPT OSCILLATION");
  if(bypassRatio>0.3)alertTags.push("BYPASS RISK");
  if(stucknessScore>0.3)alertTags.push("RUMINATION PATTERN");
  if(condScores.APPROVAL_SEEK>0.25)alertTags.push("APPROVAL RESIDUE");
  // Neutral
  if(arousal>0.5)tags.push("HIGH AROUSAL");
  if(stream1_selfFocus==="HIGH")tags.push("SELF-SATURATED VOICE");
  if(stream2_causalThink==="CAUSAL")tags.push("CAUSAL THINKER");
  if(staccato>0.28)tags.push("STACCATO PULSE");
  if(hapaxRatio>0.55)tags.push("HIGH CREATIVE RANGE");
  if(topMetaphors[0])tags.push("CORE: "+topMetaphors[0]);
  if(deprScore>griefScore&&deprScore>rageScore)tags.push("DEPRESSIVE SPECTRUM");
  else if(griefScore>deprScore&&griefScore>rageScore)tags.push("GRIEF-FORWARD");
  else if(rageScore>griefScore&&rageScore>deprScore)tags.push("RAGE-PRESENT");

  return {
    vec:vec,tc:tc,rp:rp,lex:lex,
    // L1
    iRatio:iRatio,weRatio:weRatio,youRatio:youRatio,
    onsetI:onsetI/onsetTotal,onsetConj:onsetConj/onsetTotal,onsetNoun:onsetNoun/onsetTotal,onsetVerb:onsetVerb/onsetTotal,
    ttr:ttr,hapaxRatio:hapaxRatio,avgWordLen:avgWordLen,tenseMix:tenseMix,
    // L2
    coordRatio:coordRatio,staccato:staccato,lenVar:lenVar,avgResDist:avgResDist,avgTopicEntropy:avgTopicEntropy,
    // L3
    polarityBridge:polarityBridge,coocTotal:coocTotal,topCooc:topCooc,
    peakWord:peakWord,peakCtx:peakCtx,
    griefScore:griefScore,deprScore:deprScore,rageScore:rageScore,intensityDrift:intensityDrift,
    // L4
    topMetaphors:topMetaphors,metaphorScores:metaphorScores,
    selfConceptOscillation:selfConceptOscillation,elevC:elevC,condemnC:condemnC,
    topValues:topValues,valueFreq:valueFreq,otherRep:otherRep,
    // L5
    integrationRatio:integrationRatio,locusScore:locusScore,stucknessScore:stucknessScore,
    ptgScore:ptgScore,bypassRatio:bypassRatio,avgResDist:avgResDist,
    // schemas/sigma/cond

var _sigs={},_ana={};
async function loadStore(){try{var r=await window.storage.get(SK);if(r&&r.value)return JSON.parse(r.value);}catch(e){}return{};}

function mkSig(id){return{workId:id,encounters:[],traj:{first:null,total:0,rot:[],peak:0,cur:0,trend:"unknown"}};}
function addEnc(sig,vec){
  var prev=sig.encounters.length?sig.encounters[sig.encounters.length-1].vec:null;
  var delta=vec.map(function(v,i){return v-(prev?prev[i]:0);});
  sig.encounters.push({vec:vec.slice(),delta:delta,ts:Date.now()});
  if(sig.encounters.length>50)sig.encounters.shift();
  var enc=sig.encounters,n=enc.length,center=[0,0,0,0,0],vari=[0,0,0,0,0];
  for(var e=0;e<n;e++)for(var i=0;i<5;i++)center[i]+=enc[e].vec[i]/n;
  for(var e=0;e<n;e++)for(var i=0;i<5;i++)vari[i]+=((enc[e].vec[i]-center[i])*(enc[e].vec[i]-center[i]))/n;
  var spread=0;for(var i=0;i<5;i++)spread+=Math.sqrt(vari[i]);spread/=5;
  var res=Math.round((1-spread)*1e4)/1e4;
  if(!sig.traj.first)sig.traj.first=enc[0].ts;
  sig.traj.total=n;sig.traj.rot.push({ts:Date.now(),s:res});
  if(sig.traj.rot.length>80)sig.traj.rot.shift();
  sig.traj.cur=res;if(res>sig.traj.peak)sig.traj.peak=res;
  var r=sig.traj.rot;
  if(r.length>=3){var slope=r[r.length-1].s-r[0].s;sig.traj.trend=slope>0.03?"deepening":slope<-0.03?"dissolving":"stable";if(n<4&&res>0.5)sig.traj.trend="emerging";}
  return sig;
}

function drawRadar(canvas,vec){
  var ctx=canvas.getContext("2d"),sz=canvas.width,cx=sz/2,cy=sz/2,r=sz*0.33,n=5;
  ctx.clearRect(0,0,sz,sz);
  function ang(i){return(i*2*Math.PI)/n-Math.PI/2;}
  function pt(i,v){return{x:cx+Math.cos(ang(i))*r*v,y:cy+Math.sin(ang(i))*r*v};}
  [0.25,0.5,0.75,1].forEach(function(v){ctx.beginPath();for(var i=0;i<n;i++){var p=pt(i,v);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}ctx.closePath();ctx.strokeStyle="rgba(200,169,110,0.11)";ctx.lineWidth=0.7;ctx.stroke();});
  for(var i=0;i<n;i++){var p=pt(i,1);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p.x,p.y);ctx.strokeStyle="rgba(200,169,110,0.1)";ctx.lineWidth=0.7;ctx.stroke();}
  ctx.beginPath();for(var i=0;i<n;i++){var p=pt(i,vec[i]);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}ctx.closePath();ctx.fillStyle="rgba(200,169,110,0.13)";ctx.fill();ctx.strokeStyle="#c8a96e";ctx.lineWidth=1.4;ctx.stroke();
  for(var i=0;i<n;i++){var p=pt(i,vec[i]);ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fillStyle="#c8a96e";ctx.fill();}
  var lbs=["ARO","VAL","SUP","COH","ENG"];
  ctx.font="7px 'Courier New'";ctx.fillStyle="rgba(200,169,110,0.55)";ctx.textAlign="center";ctx.textBaseline="middle";
  for(var i=0;i<n;i++){var p=pt(i,1.3);ctx.fillText(lbs[i],p.x,p.y);}
}
function sparkSVG(data,w,h){
  if(!data||data.length<2)return'<svg width="'+w+'" height="'+h+'"><text x="4" y="14" font-size="7" fill="rgba(200,169,110,0.3)" font-family="Courier New">no history</text></svg>';
  var mn=data[0],mx=data[0];for(var i=1;i<data.length;i++){if(data[i]<mn)mn=data[i];if(data[i]>mx)mx=data[i];}
  var rng=mx-mn||0.01;
  var pts=data.map(function(v,i){return((i/(data.length-1))*w)+","+(h-(((v-mn)/rng)*(h-4)+2));}).join(" ");
  var lx=w,ly=h-(((data[data.length-1]-mn)/rng)*(h-4)+2);
  return'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+'" fill="none" stroke="#c8a96e" stroke-width="1.2"/><circle cx="'+lx+'" cy="'+ly+'" r="2.5" fill="#e8c882"/></svg>';
}
function densSVG(bands,w,h){
  var bw=Math.floor(w/bands.length)-1,s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">';
  for(var i=0;i<bands.length;i++){var bh=Math.max(2,Math.round(bands[i]*(h-2)));s+='<rect x="'+(i*(bw+1))+'" y="'+(h-bh)+'" width="'+bw+'" height="'+bh+'" fill="rgba(200,169,110,'+(0.3+bands[i]*0.7).toFixed(2)+')" rx="1"/>';}
  return s+'</svg>';
}
function rhythSVG(bands,w,h){
  var bw=Math.max(2,Math.floor(w/bands.length)-1),s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">';
  for(var i=0;i<bands.length;i++){var bh=Math.max(1,Math.round(bands[i]*(h-2)));s+='<rect x="'+(i*(bw+1))+'" y="'+(h-bh)+'" width="'+bw+'" height="'+bh+'" fill="rgba(200,169,110,0.4)" rx="1"/>';}
  return s+'</svg>';
}

async function doScan(key){
  var btn=document.getElementById("btn-"+key);
  if(btn){btn.disabled=true;btn.textContent="SCANNING ···";}

  var a=analyse(key);_ana[key]=a;
  var stored=await loadStore();
  var prev=stored[key]||mkSig(META_D[key].id);
  var updated=addEnc(prev,a.vec);
  stored[key]=updated;await saveStore(stored);_sigs[key]=updated;

  renderCard(key);renderIdentity();

  var interpDiv=document.getElementById("interp-"+key);
  var interpText=document.getElementById("interp-text-"+key);
  if(interpDiv)interpDiv.style.display="block";
  if(interpText)interpText.innerHTML='<span class="cursor">▋</span>';

  var t=updated.traj,enc=updated.encounters;
  var pv=enc.length>1?enc[enc.length-2].vec:null;
  var dstr=pv?a.vec.map(function(v,i){return(v-pv[i]).toFixed(2);}).join(", "):"first encounter";
  var days=t.first?Math.max(0,Math.floor((Date.now()-t.first)/86400000)):0;

  var schemaStr=Object.keys(a.schemaScores).map(function(s){return s+":"+Math.round(a.schemaScores[s]*100);}).join(" ");
  var sigStr=Object.keys(a.sigmaScores).map(function(s){return s.replace(/_/g," ")+"="+(a.sigmaScores[s]>1?"+":"")+((a.sigmaScores[s]-1)*100).toFixed(0)+"%";}).join(" ");
  var verdStr=a.verdictSignals.join("; ");

  var msg="WORK: "+META_D[key].title+"\nENCOUNTER #"+t.total+" | TREND: "+t.trend+" | DAYS: "+days
    +"\n\nBEHAVIORAL VECTOR\nArousal:"+Math.round(a.vec[0]*100)+" Valence:"+Math.round(a.vec[1]*100)+" Suppression:"+Math.round(a.vec[2]*100)+" Coherence:"+Math.round(a.vec[3]*100)+" Engagement:"+Math.round(a.vec[4]*100)
    +"\nDelta: ["+dstr+"]"
    +"\n\nLAYER 1 — MICRO-LINGUISTIC (unconscious, unchosen)\nI-ratio:"+Math.round(a.iRatio*100)+"% We:"+Math.round(a.weRatio*100)+"% You:"+Math.round(a.youRatio*100)+"% TTR:"+Math.round(a.ttr*100)+"% Hapax:"+Math.round(a.hapaxRatio*100)+"% AvgWordLen:"+a.avgWordLen.toFixed(1)+" TenseMix:"+Math.round(a.tenseMix*100)+"%\nOnsets — I:"+Math.round(a.onsetI*100)+"% Conj:"+Math.round(a.onsetConj*100)+"% Verb:"+Math.round(a.onsetVerb*100)+"% Noun:"+Math.round(a.onsetNoun*100)+"%"
    +"\n\nLAYER 2 — STRUCTURAL\nCoordination:"+Math.round(a.coordRatio*100)+"% Staccato:"+Math.round(a.staccato*100)+"% BypassRate:"+Math.round(a.bypassRatio*100)+"% ResolutionDist:"+( a.avgResDist?a.avgResDist.toFixed(1):"n/a")+" TopicEntropy:"+a.avgTopicEntropy.toFixed(2)
    +"\n\nLAYER 3 — EMOTIONAL TOPOLOGY\nPolarityBridge:"+Math.round(a.polarityBridge*100)+"% CoocPairs:"+a.coocTotal+" PeakWord:\""+a.peakWord+"\" Grief:"+Math.round(a.griefScore*100)+" Depr:"+Math.round(a.deprScore*100)+" Rage:"+Math.round(a.rageScore*100)+" IntensityDrift:"+(a.intensityDrift>0?"+":"")+Math.round(a.intensityDrift*100)
    +"\nTop co-occurring pairs: "+a.topCooc.slice(0,5).join(", ")
    +"\n\nLAYER 4 — IDENTITY CONSISTENCY\nCoreMetaphors:"+a.topMetaphors.slice(0,4).join(",")+" SelfConceptOsc:"+Math.round(a.selfConceptOscillation*100)+" ElevC:"+a.elevC+" CondemnC:"+a.condemnC
    +"\nTopValues:"+a.topValues.join(",")+" OtherRep:"+a.otherRep
    +"\n\nLAYER 5 — PATHOLOGY vs DEPTH\nIntegration:"+Math.round(a.integrationRatio*100)+"% Locus:"+Math.round(a.locusScore*100)+"% PTG:"+Math.round(a.ptgScore*100)+"% Stuck:"+Math.round(a.stucknessScore*100)+"% Bypass:"+Math.round(a.bypassRatio*100)+"%"
    +"\n\nSCHEMAS: "+schemaStr
    +"\nSIGMA: "+sigStr
    +"\nCONDITIONING — Approval:"+Math.round(a.condScores.APPROVAL_SEEK*100)+" Liberation:"+Math.round(a.condScores.LIBERATION*100)+" SelfCritic:"+Math.round(a.condScores.SELF_CRITIC*100)+" Enmeshment:"+Math.round(a.condScores.ENMESHMENT*100)
    +"\n\nCONVERGENCE VERDICT: "+verdStr
    +"\nSTREAMS: L1="+a.stream1+" L2="+a.stream2+" L3="+a.stream3+" L4="+a.stream4+" L5="+a.stream5+" L6="+a.stream6
    +"\n\nYou are the ASE deep interpreter. Write a behavioral fingerprint report that cannot be argued with — because it cites independent signal streams, not interpretations. Reference the micro-linguistic layer (unconscious signals), structural layer, emotional topology, identity consistency, and pathology discrimination. Separate what the data says from what the author might say about themselves. Name what the convergence verdict means. If a gaslighter — internal or external — tried to dismiss this fingerprint, point to the specific signals they cannot explain away. Address schemas directly. Address the sigma deviation. Address the conditioning split. No bullets. No markdown. Max 320 words. End with FINGERPRINT: one irrefutable line.";

  try{
    var resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1200,stream:true,
        system:"You are the ASE deep signal interpreter. You read the geometry of writing, not the content. You cite specific signal readings. You separate what the data shows from what the author claims. You are not a therapist. You are not a judge. You are a precision instrument that names what the signals say, layer by layer. You do not generalize. You do not comfort. You do not pathologize depth. You name the fingerprint and it holds.",
        messages:[{role:"user",content:msg}]})
    });
    var reader=resp.body.getReader(),dec=new TextDecoder(),text="";
    while(true){
      var chunk=await reader.read();if(chunk.done)break;
      var lines=dec.decode(chunk.value).split("\n");
      for(var i=0;i<lines.length;i++){
        if(lines[i].indexOf("data: ")!==0)continue;
        var d=lines[i].slice(6);if(d==="[DONE]")break;
        try{var p=JSON.parse(d);if(p.type==="content_block_delta"&&p.delta&&p.delta.text){text+=p.delta.text;if(interpText)interpText.innerHTML=text+'<span class="cursor">▋</span>';}}catch(e){}
      }
    }
    if(interpText)interpText.innerHTML=text;
  }catch(e){if(interpText)interpText.innerHTML="[Signal lost — local analysis recorded]";}

  var b2=document.getElementById("btn-"+key);
  if(b2){b2.disabled=false;b2.textContent="SCAN AGAIN — ENCOUNTER "+(updated.traj.total+1);}
}
