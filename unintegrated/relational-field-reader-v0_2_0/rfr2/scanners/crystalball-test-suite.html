<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrystalBall · Full Test Suite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,700;1,300&family=Syne:wght@400;700;800&display=swap');

:root {
  --bg:         #040608;
  --s1:         #080c10;
  --s2:         #0c1218;
  --s3:         #101820;
  --border:     #182330;
  --border2:    #1e2e3c;
  --c0:         #00f0c0;   /* teal — pass */
  --c1:         #ff4060;   /* red  — fail */
  --c2:         #ffc030;   /* amber — warn */
  --c3:         #60a0ff;   /* blue — info */
  --c4:         #c060ff;   /* purple — kernel */
  --c5:         #40e080;   /* green — runtime */
  --c6:         #ff8040;   /* orange — compress */
  --c7:         #ff60c0;   /* pink — codec */
  --text:       #b8ccd8;
  --text2:      #506070;
  --text3:      #2a3a48;
  --font:       'JetBrains Mono', monospace;
  --display:    'Syne', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 11px;
  line-height: 1.5;
}

/* ── Scanlines ── */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,240,192,.008) 3px, rgba(0,240,192,.008) 4px);
  pointer-events: none; z-index: 9998;
}

/* ── Top bar ── */
#topbar {
  height: 44px;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px; gap: 16px;
  position: relative; z-index: 100;
}
#topbar h1 {
  font-family: var(--display); font-size: 17px; font-weight: 800;
  color: var(--c0); letter-spacing: -.3px;
}
#topbar .sub { color: var(--text2); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
#topbar .spacer { flex: 1; }
#topbar .counters { display: flex; gap: 12px; font-size: 10px; }
.cnt-pass { color: var(--c0); } .cnt-fail { color: var(--c1); } .cnt-skip { color: var(--c2); }
#topbar button {
  background: var(--c0); color: var(--bg); border: none; border-radius: 3px;
  font-family: var(--font); font-size: 10px; font-weight: 700;
  padding: 5px 14px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
}
#topbar button:disabled { opacity: .4; cursor: default; }
#topbar button.running { background: var(--c2); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .6; } }

/* ── Layout ── */
#layout {
  display: grid;
  grid-template-columns: 220px 1fr 340px;
  height: calc(100vh - 44px);
  overflow: hidden;
}

/* ── Sidebar ── */
#sidebar {
  background: var(--s1);
  border-right: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden;
}
.suite-group { border-bottom: 1px solid var(--border); }
.suite-head {
  padding: 8px 12px 7px;
  font-size: 9px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.suite-head .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.test-item {
  padding: 5px 12px 5px 22px;
  cursor: pointer; font-size: 10px; color: var(--text2);
  display: flex; align-items: center; gap: 6px;
  border-left: 2px solid transparent;
  transition: all .1s;
}
.test-item:hover { color: var(--text); background: var(--s2); }
.test-item.active { color: var(--text); border-left-color: var(--c0); background: var(--s2); }
.test-item.pass { color: var(--c0); }
.test-item.fail { color: var(--c1); }
.test-item.running { color: var(--c2); }
.test-item .status { margin-left: auto; font-size: 9px; }
.test-item .dur { color: var(--text2); font-size: 9px; margin-left: 4px; }

/* ── Main panel ── */
#main {
  display: flex; flex-direction: column;
  overflow: hidden; background: var(--s2);
}
#test-header {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--s1);
  flex-shrink: 0;
}
#test-header .test-name {
  font-family: var(--display); font-size: 15px; font-weight: 700;
  color: var(--text); margin-bottom: 3px;
}
#test-header .test-meta {
  color: var(--text2); font-size: 9px; letter-spacing: 1px;
  display: flex; gap: 14px;
}
.meta-tag {
  background: var(--s3); padding: 2px 7px; border-radius: 2px;
  border: 1px solid var(--border);
}
.meta-tag.pass { color: var(--c0); border-color: var(--c0); }
.meta-tag.fail { color: var(--c1); border-color: var(--c1); }
.meta-tag.run  { color: var(--c2); border-color: var(--c2); }

/* Result rows */
#results {
  flex: 1; overflow-y: auto; padding: 12px 18px;
  display: flex; flex-direction: column; gap: 6px;
}
.result-row {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 3px; padding: 8px 12px;
  display: grid; grid-template-columns: 14px 1fr auto;
  gap: 8px; align-items: start;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }
.result-row.pass { border-left: 2px solid var(--c0); }
.result-row.fail { border-left: 2px solid var(--c1); background: rgba(255,64,96,.04); }
.result-row.info { border-left: 2px solid var(--c3); }
.result-row.warn { border-left: 2px solid var(--c2); }
.result-row .icon { font-size: 11px; padding-top: 1px; }
.result-row .body { color: var(--text); font-size: 10px; }
.result-row .body .label { color: var(--text2); }
.result-row .body .val  { color: var(--c0); }
.result-row .body .val.bad { color: var(--c1); }
.result-row .body .val.warn { color: var(--c2); }
.result-row .body .val.blue { color: var(--c3); }
.result-row .body .val.purple { color: var(--c4); }
.result-row .body .val.pink { color: var(--c7); }
.result-row .dur { color: var(--text2); font-size: 9px; white-space: nowrap; }
.result-row pre {
  margin-top: 5px; font-size: 9px; color: var(--text2);
  background: var(--bg); padding: 6px 8px; border-radius: 2px;
  overflow-x: auto; max-height: 120px; white-space: pre-wrap; word-break: break-all;
}
.expand-btn {
  font-size: 9px; color: var(--text2); background: none;
  border: 1px solid var(--border); padding: 1px 5px; cursor: pointer;
  border-radius: 2px; margin-top: 4px; font-family: var(--font);
}
.expand-btn:hover { color: var(--text); }

/* ── Event log (right panel) ── */
#log-panel {
  background: var(--s1);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#log-header {
  padding: 10px 12px 9px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
#log-header .title {
  font-size: 9px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--c4);
}
#log-header .ev-count { color: var(--text2); font-size: 9px; margin-left: auto; }
.log-filters {
  padding: 7px 10px; border-bottom: 1px solid var(--border);
  display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0;
}
.lf-btn {
  font-size: 8px; font-family: var(--font); font-weight: 700;
  padding: 2px 7px; border-radius: 2px; cursor: pointer;
  border: 1px solid var(--border2); background: var(--s2);
  color: var(--text2); letter-spacing: .5px; transition: all .1s;
}
.lf-btn.active { background: var(--c4); color: var(--bg); border-color: var(--c4); }
#log-stream {
  flex: 1; overflow-y: auto; padding: 6px 0;
  font-size: 9px;
}
.log-ev {
  padding: 3px 10px 3px 12px;
  border-left: 2px solid transparent;
  display: grid; grid-template-columns: 60px 1fr;
  gap: 6px; line-height: 1.4;
  transition: background .1s;
}
.log-ev:hover { background: var(--s2); }
.log-ev.t-kernel   { border-left-color: var(--c4); }
.log-ev.t-codec    { border-left-color: var(--c7); }
.log-ev.t-pipeline { border-left-color: var(--c6); }
.log-ev.t-nexus    { border-left-color: var(--c0); }
.log-ev.t-delta    { border-left-color: var(--c3); }
.log-ev.t-sigma    { border-left-color: var(--c5); }
.log-ev.t-compress { border-left-color: var(--c6); }
.log-ev.t-gate     { border-left-color: var(--c2); }
.log-ev.t-error    { border-left-color: var(--c1); background: rgba(255,64,96,.03); }
.log-ev .ts   { color: var(--text3); font-size: 8px; padding-top: 1px; }
.log-ev .etype { color: var(--text2); }
.log-ev .etype .ns { color: var(--text3); }
.log-ev .eid  { font-size: 8px; color: var(--text3); }
.log-ev .epay { font-size: 8px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Progress bar ── */
#progress-wrap {
  height: 3px; background: var(--border);
  flex-shrink: 0; overflow: hidden;
}
#progress-bar {
  height: 100%; background: var(--c0); width: 0%;
  transition: width .3s ease;
}

/* ── Scrollbars ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }
</style>
</head>
<body>

<div id="topbar">
  <h1>◈ CrystalBall</h1>
  <span class="sub">Full Test Suite</span>
  <div class="spacer"></div>
  <div class="counters">
    <span class="cnt-pass">✓ <span id="c-pass">0</span></span>
    <span class="cnt-fail">✗ <span id="c-fail">0</span></span>
    <span class="cnt-skip">◌ <span id="c-skip">0</span></span>
    <span style="color:var(--text2)">/ <span id="c-total">0</span></span>
  </div>
  <button id="run-btn" onclick="runAll()">▶ RUN ALL</button>
</div>

<div id="layout">
  <div id="sidebar"></div>
  <div id="main">
    <div id="test-header">
      <div class="test-name" id="th-name">Select a test or click RUN ALL</div>
      <div class="test-meta" id="th-meta"></div>
    </div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="results"></div>
  </div>
  <div id="log-panel">
    <div id="log-header">
      <span class="title">⬡ Causal Nexus Log</span>
      <span class="ev-count">ev: <span id="ev-count">0</span></span>
    </div>
    <div class="log-filters">
      <button class="lf-btn active" data-f="all" onclick="setFilter(this,'all')">ALL</button>
      <button class="lf-btn" data-f="kernel"   onclick="setFilter(this,'kernel')">KERNEL</button>
      <button class="lf-btn" data-f="codec"    onclick="setFilter(this,'codec')">CODEC</button>
      <button class="lf-btn" data-f="pipeline" onclick="setFilter(this,'pipeline')">PIPELINE</button>
      <button class="lf-btn" data-f="delta"    onclick="setFilter(this,'delta')">DELTA</button>
      <button class="lf-btn" data-f="sigma"    onclick="setFilter(this,'sigma')">SIGMA</button>
      <button class="lf-btn" data-f="gate"     onclick="setFilter(this,'gate')">GATE</button>
      <button class="lf-btn" data-f="error"    onclick="setFilter(this,'error')">ERROR</button>
    </div>
    <div id="log-stream"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CAUSAL NEXUS — inline implementation (identity, time, causality, kernel)
// ═══════════════════════════════════════════════════════════════════════════

const Nexus = (() => {
  // ── identity ──
  function newEventId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
    const h=Array.from(b).map(x=>x.toString(16).padStart(2,'0'));
    return [h.slice(0,4),h.slice(4,6),h.slice(6,8),h.slice(8,10),h.slice(10,16)].map(a=>a.join('')).join('-');
  }
  function shortId(id) { const p=id.split('-'); return p[p.length-1]||id.slice(-8); }
  function isValidEventId(id) { return typeof id==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id); }
  function canonicalize(v) {
    if(v===null||v===undefined) return 'null';
    if(typeof v==='boolean') return String(v);
    if(typeof v==='number') return String(v);
    if(typeof v==='string') return JSON.stringify(v);
    if(Array.isArray(v)) return '['+v.map(canonicalize).join(',')+']';
    if(typeof v==='object') { const k=Object.keys(v).sort(); return '{'+k.map(kk=>JSON.stringify(kk)+':'+canonicalize(v[kk])).join(',')+'}'; }
    return JSON.stringify(v);
  }
  function hash64(s) {
    let h1=0x811c9dc5|0, h2=0xc4a6c57b|0;
    for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,0x01000193);h2=Math.imul(h2^c,0x01000193)^(h1>>>13);}
    return((h1>>>0).toString(16).padStart(8,'0'))+((h2>>>0).toString(16).padStart(8,'0'));
  }
  function contentHash(type,payload,source){return hash64(canonicalize({type,payload:payload??{},source:source??'unknown'}));}

  // ── time ──
  function createClock() {
    let _t=0,_s=0;
    return { nextTick(){return++_t;}, nextSeq(){return++_s;}, get tick(){return _t;}, get seq(){return _s;}, reset(){_t=0;_s=0;} };
  }
  function wallNow(){ return Date.now(); }
  function formatWallTs(ms){const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')+'.'+String(d.getMilliseconds()).padStart(3,'0');}

  // ── causality ──
  const EDGE_CAUSAL_EXPLICIT='causal/explicit', EDGE_CAUSAL_RULE='causal/rule',
        EDGE_CAUSAL_ADAPTER='causal/adapter', EDGE_OBSERVATIONAL='observational';
  const CAUSAL_EDGE_TYPES=new Set([EDGE_CAUSAL_EXPLICIT,EDGE_CAUSAL_RULE,EDGE_CAUSAL_ADAPTER]);
  function isCausalEdge(e){return CAUSAL_EDGE_TYPES.has(e.edgeType);}

  function createCausalStore() {
    const edgeMap=new Map(), childrenMap=new Map(), causalChildrenMap=new Map();
    function addEdge(e) {
      if(edgeMap.has(e.toId)) return; // skip diamond
      edgeMap.set(e.toId,e);
      if(!childrenMap.has(e.fromId)) childrenMap.set(e.fromId,new Set());
      childrenMap.get(e.fromId).add(e.toId);
      if(isCausalEdge(e)){
        if(!causalChildrenMap.has(e.fromId)) causalChildrenMap.set(e.fromId,new Set());
        causalChildrenMap.get(e.fromId).add(e.toId);
      }
    }
    function pruneEdgesFor(id) {
      const e=edgeMap.get(id);
      if(e){childrenMap.get(e.fromId)?.delete(id);causalChildrenMap.get(e.fromId)?.delete(id);edgeMap.delete(id);}
      childrenMap.delete(id); causalChildrenMap.delete(id);
    }
    function traceToRoot(id,maxDepth=100){
      const chain=[];let cur=id,d=0;
      while(cur&&d++<maxDepth){chain.push(cur);const e=edgeMap.get(cur);if(!e||!isCausalEdge(e))break;cur=e.fromId;}
      return chain;
    }
    function descendants(id,maxD=50){
      const r=new Set(),q=[[id,0]];
      while(q.length){const[c,d]=q.shift();if(d>=maxD)continue;for(const ch of causalChildrenMap.get(c)??[]){if(!r.has(ch)){r.add(ch);q.push([ch,d+1]);}}}
      return r;
    }
    return {addEdge,pruneEdgesFor,getParentEdge:id=>edgeMap.get(id)??null,getChildren:id=>new Set(childrenMap.get(id)??[]),traceToRoot,descendants,edgeMeta:id=>edgeMap.get(id)??null};
  }

  // ── kernel ──
  const GATE_DEPTH_MAX=20;
  function gateOutput(type,payload,meta){return{type,payload:payload??{},meta:meta??{}};}

  function createKernel({ringCap=10000,calltoTtlTicks=0}={}) {
    const clock=createClock(), ring=[], byId=new Map(), typeIndex=new Map();
    const causalStore=createCausalStore();
    const gates=[], listeners=new Set();
    let _head=0,_size=0,_gateDepth=0;
    let _evicted=null;

    function _storeEvent(ev) {
      if(_size===ringCap){
        _evicted=ring[_head];
        if(_evicted){byId.delete(_evicted.id);typeIndex.get(_evicted.type)?.delete(_evicted.id);causalStore.pruneEdgesFor(_evicted.id);}
      }
      ring[_head]=ev; _head=(_head+1)%ringCap; if(_size<ringCap)_size++;
      byId.set(ev.id,ev);
      if(!typeIndex.has(ev.type))typeIndex.set(ev.type,new Set());
      typeIndex.get(ev.type).add(ev.id);
    }

    function _runGates(ev) {
      if(_gateDepth>=GATE_DEPTH_MAX)return[];
      _gateDepth++;
      const outputs=[];
      const sorted=[...gates].sort((a,b)=>a.priority-b.priority);
      try{for(const g of sorted){let r;try{r=g.fn(ev,{typeIds:t=>Array.from(typeIndex.get(t)??[]),findById:id=>byId.get(id)??null});}catch{r=[];}if(Array.isArray(r))outputs.push(...r);}}
      finally{_gateDepth--;}
      return outputs;
    }

    function ingest(type,payload={},meta={}) {
      const id=newEventId(), ts=wallNow(), eventTs=clock.nextTick(), seq=clock.nextSeq();
      const ch=contentHash(type,payload,meta.source);
      const ev=Object.freeze({id,type,payload:Object.freeze({...payload}),source:meta.source??'test',causedBy:meta.causedBy??null,edgeType:meta.edgeType??null,eventTs,seq,ts,contentHash:ch});
      _storeEvent(ev);
      if(ev.causedBy&&ev.edgeType)causalStore.addEdge({fromId:ev.causedBy,toId:ev.id,edgeType:ev.edgeType,ruleName:meta.ruleName??'',dtTicks:0,confidence:1});
      const gateOuts=_runGates(ev);
      for(const o of gateOuts){
        ingest(o.type,o.payload,{...o.meta,causedBy:o.meta?.causedBy??ev.id,edgeType:o.meta?.edgeType??EDGE_CAUSAL_RULE});
      }
      for(const fn of listeners)try{fn(ev);}catch{}
      return ev;
    }

    function subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn);}
    function registerGate(sig,fn,{priority=50}={}){gates.push({sig,fn,priority});}
    function removeGate(sig){const i=gates.findIndex(g=>g.sig===sig);if(i>=0)gates.splice(i,1);}
    function findById(id){return byId.get(id)??null;}
    function getAll(){const out=[];for(let i=0;i<_size;i++)out.push(ring[(_head-_size+i+ringCap)%ringCap]);return out;}
    function traceToRoot(id,d){return causalStore.traceToRoot(id,d).map(i=>byId.get(i)).filter(Boolean);}
    function descendants(id,d){return[...causalStore.descendants(id,d)].map(i=>byId.get(i)).filter(Boolean);}
    function edgeMeta(id){return causalStore.edgeMeta(id);}
    function getChildren(id){return causalStore.getChildren(id);}
    function reset(){ring.length=0;byId.clear();typeIndex.clear();clock.reset();gates.length=0;_head=0;_size=0;}
    function stats(){return{size:_size,cap:ringCap,tick:clock.tick,seq:clock.seq,types:[...typeIndex.keys()].length};}

    return {ingest,subscribe,registerGate,removeGate,findById,getAll,traceToRoot,descendants,edgeMeta,getChildren,reset,stats,_typeIndex:typeIndex,_clock:clock};
  }

  // ── delta ──
  function computeDeltaStream(events,findById,edgeMeta,getChildren) {
    const gaps=[],rates=[],depths=[];
    let prevTs=null,prevRate=0;
    const deltas=[];
    for(let i=0;i<events.length;i++){
      const ev=events[i];
      const gap=prevTs!==null?ev.eventTs-prevTs:0;
      gaps.push(gap); if(gaps.length>50)gaps.shift();
      const meanG=gaps.reduce((a,b)=>a+b,0)/gaps.length;
      const varG=gaps.reduce((a,b)=>a+(b-meanG)**2,0)/gaps.length;
      const sigmaG=Math.sqrt(varG);
      const latencyImpact=sigmaG>0?(gap-meanG)/sigmaG:0;
      const childCount=getChildren(ev.id).size;
      rates.push(1/(gap||1)); if(rates.length>100)rates.shift();
      const rate=rates.reduce((a,b)=>a+b,0)/rates.length;
      const throughputChange=rate-prevRate;
      // causal depth
      let depth=0; let cur=edgeMeta(ev.id); while(cur){depth++;cur=edgeMeta(cur.fromId);}
      depths.push(depth); if(depths.length>50)depths.shift();
      const meanD=depths.reduce((a,b)=>a+b,0)/depths.length;
      const varD=depths.reduce((a,b)=>a+(b-meanD)**2,0)/depths.length;
      const sigmaD=Math.sqrt(varD);
      const structuralDeviation=sigmaD>0?(depth-meanD)/sigmaD:0;
      deltas.push({eventId:ev.id,eventType:ev.type,gap,latencyImpact,ownDepth:depth,throughputChange,childCount,structuralDeviation});
      prevTs=ev.eventTs; prevRate=rate;
    }
    return deltas;
  }

  function computeThroughputTimeline(events,windowSize=10) {
    if(!events.length)return[];
    const buckets=new Map();
    for(const ev of events){const b=Math.floor(ev.eventTs/windowSize);buckets.set(b,(buckets.get(b)??0)+1);}
    return [...buckets.entries()].sort((a,b)=>a[0]-b[0]).map(([t,count])=>({windowStart:t*windowSize,windowEnd:(t+1)*windowSize,count}));
  }

  function detectFractals(events,getChildren,edgeMeta,opts={}) {
    const{minChainLen=3,minOccurrences=3}=opts;
    const patterns=new Map();

// LOG ENGINE — Causal Nexus backed event log
// ═══════════════════════════════════════════════════════════════════════════
const LOG = (() => {
  const kernel=Nexus.createKernel({ringCap:5000});
  let filter='all';

  // Register a burst-detection gate
  kernel.registerGate('test.burst.detector',(ev,query)=>{
    if(ev.type!=='test.codec.audio.frame')return[];
    if((ev.payload?.energyAnomaly)&&(ev.payload?.energy??0)>.5){
      return[Nexus.gateOutput('test.gate.burst.alert',{ref:ev.id,energy:ev.payload.energy},{source:'gate:burst-detector',causedBy:ev.id,edgeType:Nexus.EDGE_CAUSAL_RULE})];
    }
    return[];
  },{priority:30});

  // Register a sigma-degraded gate
  kernel.registerGate('test.sigma.watch',(ev,query)=>{
    if(ev.type!=='test.sigma.classify')return[];
    if(ev.payload?.regime==='degraded'||ev.payload?.regime==='collapsing'){
      return[Nexus.gateOutput('test.gate.sigma.alert',{regime:ev.payload.regime,confidence:ev.payload.confidence},{source:'gate:sigma-watch',causedBy:ev.id,edgeType:Nexus.EDGE_CAUSAL_RULE})];
    }
    return[];
  },{priority:40});

  function emit(type,payload,meta){return kernel.ingest(type,payload??{},meta??{});}
  function getAll(){return kernel.getAll();}
  function setFilter(f){filter=f;renderLog();}
  function stats(){return kernel.stats();}

  function typeClass(type){
    if(type.startsWith('test.kernel'))return 't-kernel';
    if(type.startsWith('test.codec')||type.startsWith('test.friction')||type.startsWith('test.assoc')||type.startsWith('test.predict')||type.startsWith('test.pitch')||type.startsWith('test.saccade'))return 't-codec';
    if(type.startsWith('test.pipeline')||type.startsWith('test.encrypt')||type.startsWith('test.compress.video')||type.startsWith('test.compress.audio'))return 't-pipeline';
    if(type.startsWith('test.nexus')||type.startsWith('test.identity')||type.startsWith('test.time')||type.startsWith('test.causality'))return 't-nexus';
    if(type.startsWith('test.delta'))return 't-delta';
    if(type.startsWith('test.sigma'))return 't-sigma';
    if(type.startsWith('test.snap')||type.startsWith('test.blueprint')||type.startsWith('test.compress'))return 't-compress';
    if(type.startsWith('test.gate'))return 't-gate';
    if(type.includes('error')||type.includes('fail'))return 't-error';
    return 't-nexus';
  }

  function renderLog(){
    const events=kernel.getAll();
    const filtered=filter==='all'?events:events.filter(ev=>typeClass(ev.type)==='t-'+filter||(filter==='error'&&ev.type.includes('error')));
    const stream=document.getElementById('log-stream');
    stream.innerHTML='';
    const slice=filtered.slice(-300);
    for(const ev of slice){
      const div=document.createElement('div');
      div.className='log-ev '+typeClass(ev.type);
      const parts=ev.type.split('.');
      const ns=parts.slice(0,2).join('.');const name=parts.slice(2).join('.');
      const payStr=JSON.stringify(ev.payload).slice(0,80);
      div.innerHTML=`<span class="ts">${Nexus.formatWallTs(ev.ts)}</span><div><div class="etype"><span class="ns">${ns}.</span>${name}${ev.causedBy?` <span style="color:var(--text3)">← ${Nexus.shortId(ev.causedBy)}</span>`:''}</div><div class="epay">${payStr}</div></div>`;
      stream.appendChild(div);
    }
    stream.scrollTop=stream.scrollHeight;
    document.getElementById('ev-count').textContent=events.length;
  }

  // Subscribe to re-render on new events
  let renderTimer=null;
  kernel.subscribe(()=>{clearTimeout(renderTimer);renderTimer=setTimeout(renderLog,50);});

  return{emit,getAll,setFilter,stats,kernel,renderLog};
})();

    LOG.emit('test.nexus.e2e.summary',{totalEvents:k.stats().size,regime:sigmaResult.regime,confidence:sigmaResult.confidence,compressionRatio:snap.ratio,vocabSize:bp.typeCount,assocEdges:assoc.edges.length,report:report.summary},{source:'test.e2e'});

    return[
      ok('session has 80+ events',k.stats().size>80,k.stats().size,'>80'),
      ok('delta stream covers all events',deltas.length===events.length,deltas.length,events.length),
      ok('sigma classification computed',sigmaResult.regime in Nexus.REGIMES,sigmaResult.regime,'valid'),
      ok('snapshot compresses kernel',snap.primaryCount>0&&snap.ratio>0,snap.ratio,'>0'),
      ok('blueprint vocab > 5 types',bp.typeCount>5,bp.typeCount,'>5'),
      ok('association edges formed',assoc.edges.length>=0,assoc.edges.length,'>=0'),
      info('regime',sigmaResult.regime+' (confidence='+sigmaResult.confidence+')'),
      info('compression',report.summary),
      info('vocab types',bp.typeCount),
    ];
  },
  async function causal_nexus_invariant_i1(){
    // I-1: event.id is UUID v4, never deterministic
    const k=Nexus.createKernel({ringCap:100});
    const ids=new Set();for(let i=0;i<100;i++)ids.add(k.ingest('i1.event',{i},{source:'test'}).id);
    const allValid=[...ids].every(id=>Nexus.isValidEventId(id));
    LOG.emit('test.nexus.invariant.I1',{unique:ids.size===100,allValid},{source:'test.invariants'});
    return[ok('I-1: 100 unique UUID v4 ids',ids.size===100&&allValid,`${ids.size} unique, allValid=${allValid}`,'100 unique')];
  },
  async function causal_nexus_invariant_i2(){
    // I-2: contentHash orthogonal to id
    const h1=Nexus.contentHash('ev',{x:1},'src');
    const h2=Nexus.contentHash('ev',{x:1},'src');
    const id1=Nexus.newEventId(),id2=Nexus.newEventId();
    LOG.emit('test.nexus.invariant.I2',{h1,h2,id1,id2,hashEqual:h1===h2,idEqual:id1===id2},{source:'test.invariants'});
    return[ok('I-2: identical payload → same hash',h1===h2,`${h1}===${h2}`,'equal'),ok('I-2: hash independent of id',id1!==id2,`id1!==id2`,true)];
  },
  async function causal_nexus_invariant_h1(){
    // H-1: edge graph bounded by ring eviction
    const k=Nexus.createKernel({ringCap:10});
    const root=k.ingest('h1.root',{},{source:'test'});
    for(let i=0;i<5;i++)k.ingest('h1.child',{i},{source:'test',causedBy:root.id,edgeType:Nexus.EDGE_CAUSAL_EXPLICIT});
    // Overfill ring so root gets evicted
    for(let i=0;i<15;i++)k.ingest('h1.filler',{i},{source:'test'});
    const rootAfterEvict=k.findById(root.id);
    LOG.emit('test.nexus.invariant.H1',{rootEvicted:rootAfterEvict===null},{source:'test.invariants'});
    return[ok('H-1: evicted event edges pruned',rootAfterEvict===null,rootAfterEvict,null)];
  },
  async function full_log_query(){
    const allEvents=LOG.getAll();
    const byType=new Map();
    for(const ev of allEvents)byType.set(ev.type,(byType.get(ev.type)??0)+1);
    const topTypes=[...byType.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
    const gateEvs=allEvents.filter(e=>e.source?.startsWith('gate:'));
    LOG.emit('test.nexus.log_query',{totalEvents:allEvents.length,uniqueTypes:byType.size,gateEventCount:gateEvs.length,topTypes:topTypes.map(([t,c])=>t+':'+c)},{source:'test.e2e'});
    return[ok('log has events',allEvents.length>50,allEvents.length,'>50'),ok('gate events found in log',gateEvs.length>0,gateEvs.length,'>0'),ok('multiple event types',byType.size>10,byType.size,'>10'),...topTypes.map(([t,c])=>info(`${t}: ${c} events`,null))];
  },
]);

// ═══════════════════════════════════════════════════════════════════════════
// UI RENDERING
// ═══════════════════════════════════════════════════════════════════════════
let _allTests=[],_testResults=new Map();

function buildSidebar(){
  const sb=document.getElementById('sidebar');sb.innerHTML='';
  let total=0;
  for(const suite of TESTS){
    const grp=document.createElement('div');grp.className='suite-group';
    const head=document.createElement('div');head.className='suite-head';
    head.innerHTML=`<span class="dot" style="background:${suite.color}"></span>${suite.name}`;
    grp.appendChild(head);
    for(const fn of suite.tests){
      total++;
      const item=document.createElement('div');
      item.className='test-item';item.id='ti-'+fn.name;
      item.innerHTML=`<span class="status" id="st-${fn.name}">◌</span>${fn.name.replace(/_/g,' ')}<span class="dur" id="dr-${fn.name}"></span>`;
      item.onclick=()=>showResult(fn.name);
      grp.appendChild(item);
      _allTests.push({fn,suite});
    }
    sb.appendChild(grp);
  }
  document.getElementById('c-total').textContent=total;
}

function showResult(name){
  _active=name;
  document.querySelectorAll('.test-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('ti-'+name)?.classList.add('active');
  const r=_testResults.get(name);
  const suite=_allTests.find(t=>t.fn.name===name)?.suite;
  document.getElementById('th-name').textContent=name.replace(/_/g,' ');
  const meta=document.getElementById('th-meta');
  if(r){
    const pass=r.results.filter(x=>x.pass===true).length;
    const fail=r.results.filter(x=>x.pass===false).length;
    meta.innerHTML=`<span class="meta-tag ${r.pass?'pass':'fail'}">${r.pass?'✓ PASS':'✗ FAIL'}</span><span class="meta-tag">${suite?.name||''}</span><span class="meta-tag">${Math.round(r.dur)}ms</span><span class="meta-tag">${pass}/${pass+fail} assertions</span>`;
  } else {
    meta.innerHTML=`<span class="meta-tag run">◌ pending</span><span class="meta-tag">${suite?.name||''}</span>`;
  }
  renderResults(name);
}

function renderResults(name){
  const container=document.getElementById('results');container.innerHTML='';
  const r=_testResults.get(name);if(!r)return;
  for(const res of r.results){
    const row=document.createElement('div');
    const cls=res.type==='info'?'info':res.type==='warn'?'warn':res.pass?'pass':'fail';
    row.className='result-row '+cls;
    const icon=res.type==='info'?'◈':res.type==='warn'?'⚠':res.pass?'✓':'✗';
    let body='';
    if(res.type==='info'){
      body=`<span class="label">${res.name}:</span> <span class="val blue">${typeof res.got==='string'?res.got:JSON.stringify(res.got)??''}</span>`;
    } else if(res.type==='warn'){
      body=`<span class="val warn">${res.name}</span>`;
    } else {
      const valClass=res.pass?'val':'val bad';
      body=`${res.name} — got <span class="${valClass}">${JSON.stringify(res.got)}</span>`;
      if(res.expected!==undefined&&!res.pass)body+=` expected <span class="val">${JSON.stringify(res.expected)}</span>`;
    }
    row.innerHTML=`<span class="icon">${icon}</span><div class="body">${body}</div><span class="dur">${res.dur>0?Math.round(res.dur)+'ms':''}</span>`;
    container.appendChild(row);
  }
}

function updateSidebarItem(name,pass,dur){
  const item=document.getElementById('ti-'+name);
  const st=document.getElementById('st-'+name);
  const dr=document.getElementById('dr-'+name);
  if(item){item.classList.remove('running');item.classList.add(pass?'pass':'fail');}
  if(st)st.textContent=pass?'✓':'✗';
  if(dr)dr.textContent=Math.round(dur)+'ms';
}

// ═══════════════════════════════════════════════════════════════════════════
// RUN ENGINE
// ═══════════════════════════════════════════════════════════════════════════
let _running=false;

async function runAll(){
  if(_running)return;
  _running=true;
  _pass=0;_fail=0;
  document.getElementById('run-btn').textContent='◼ RUNNING';
  document.getElementById('run-btn').className='running';
  document.getElementById('c-pass').textContent='0';
  document.getElementById('c-fail').textContent='0';

  const total=_allTests.length;
  const bar=document.getElementById('progress-bar');

  for(let i=0;i<total;i++){
    const{fn,suite}=_allTests[i];
    const item=document.getElementById('ti-'+fn.name);
    if(item)item.classList.add('running');
    if(item){item.scrollIntoView({behavior:'smooth',block:'nearest'});}

    const t0=performance.now();
    let results=[];
    let pass=true;
    try{results=await fn();}catch(e){results=[{name:'Uncaught: '+e.message,pass:false,got:e.message,expected:'no error',type:'assert'}];LOG.emit('test.error',{name:fn.name,error:e.message},{source:'test.runner'});}
    const dur=performance.now()-t0;

    const hasFail=results.some(r=>r.pass===false);
    if(hasFail)pass=false;

    _testResults.set(fn.name,{results,pass,dur});
    updateSidebarItem(fn.name,pass,dur);
    if(pass)_pass++;else _fail++;
    document.getElementById('c-pass').textContent=_pass;
    document.getElementById('c-fail').textContent=_fail;
    bar.style.width=((i+1)/total*100)+'%';
    // Auto-show last run test
    showResult(fn.name);
    await new Promise(r=>setTimeout(r,5));
  }

  document.getElementById('run-btn').textContent='▶ RUN ALL';
  document.getElementById('run-btn').className='';
  document.getElementById('run-btn').disabled=false;
  _running=false;
  bar.style.background=_fail>0?'var(--c1)':'var(--c0)';
  LOG.emit('test.suite.complete',{pass:_pass,fail:_fail,total,passRate:Math.round(_pass/total*100)+'%'},{source:'test.runner'});
}

// Expose globals for inline onclick handlers
window.runAll = runAll;

// Init
buildSidebar();
showResult(_allTests[0]?.fn?.name);
</script>
